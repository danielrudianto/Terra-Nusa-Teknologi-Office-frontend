<mat-drawer-container class="dashboard__container">
  <!--
    Mode mengikuti lebar layar: `side` mendorong isi, `over` menutupinya.

    Sebelumnya `side` tetap — pada ponsel 390px, sidenav memakan 250px dan
    padding halaman 64px, menyisakan 76px untuk seluruh isi halaman.
  -->
  <mat-drawer
    [mode]="modeSidenav"
    [opened]="isSidenavigationOpened"
    (closedStart)="tandaiTertutup()"
    class="dashboard__container__side"
  >
    <app-side-nav
      style="overflow-y: hidden"
      [items]="sideNavItems()"
      (click)="tutupBilaMenutupi()"
    />
  </mat-drawer>
  <mat-drawer-content class="dashboard__container__content">
    <app-top-navigation
      [label]="label"
      (onBookmarkClicked)="ubahSidenav()"
    />
    <!--
      Transisi halaman dipasang pada PEMBUNGKUS outlet, bukan pada outletnya.

      `<router-outlet>` sendiri tidak merender apa pun — komponen halaman
      disisipkan sebagai SAUDARA di sebelahnya, bukan sebagai anaknya. Trigger
      yang dipasang di sana tidak akan menyentuh isi halaman sama sekali, dan
      gejalanya persis seperti animasi yang tidak pernah menyala.
    -->
    <div
      class="dashboard__container__router"
      [@transisiRute]="{
        value: kunciRute(),
        params: { durasi: durasiTransisi, jeda: jedaJudul }
      }"
    >
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>

<!-- Panel panduan: dipasang SEKALI di sini, bukan di tiap halaman. -->
<app-panduan-fab />
<app-panduan-panel />
