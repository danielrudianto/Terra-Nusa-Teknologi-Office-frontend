<!--
  Pemberitahuan versi baru.

  Muncul di paling atas, di luar drawer, supaya terlihat pada halaman mana
  pun yang sedang dibuka.

  TIDAK memuat ulang sendiri: yang sedang mengisi formulir purchase order
  akan kehilangan seluruh isiannya, dan itu kerugian yang jauh lebih terasa
  daripada menunda pembaruan beberapa menit.
-->
@if (versi.adaPembaruan()) {
  <div class="dashboard__versi">
    <mat-icon>system_update_alt</mat-icon>
    <span>{{ "app.versiBaru" | translate }}</span>
    <button type="button" (click)="versi.muatUlang()">
      {{ "app.muatUlang" | translate }}
    </button>
  </div>
}

<mat-drawer-container class="dashboard__container">
  <!--
    Mode mengikuti lebar layar: `side` mendorong isi, `over` menutupinya.

    Sebelumnya `side` tetap — pada ponsel 390px, sidenav memakan 250px dan
    padding halaman 64px, menyisakan 76px untuk seluruh isi halaman.
  -->
  <mat-drawer
    [mode]="modeSidenav"
    [opened]="isSidenavigationOpened"
    (closedStart)="tandaiTertutup()"
    class="dashboard__container__side"
  >
    <app-side-nav
      style="overflow-y: hidden"
      [items]="sideNavItems()"
      (click)="tutupBilaMenutupi()"
    />
  </mat-drawer>
  <mat-drawer-content class="dashboard__container__content">
    <app-top-navigation
      [label]="label"
      (onBookmarkClicked)="ubahSidenav()"
    />
    <div class="dashboard__container__router">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>

<!-- Panel panduan: dipasang SEKALI di sini, bukan di tiap halaman. -->
<app-panduan-fab />
<app-panduan-panel />
