<div class="title__wrapper mb-4">
  <h1 class="title">Client</h1>
</div>

<div class="position-absolute bottom-0 end-0 m-3">
  <button mat-fab color="primary" routerLink="/Client/Create">
    <mat-icon>add</mat-icon>
  </button>
</div>

<div class="search__wrapper">
  <mat-form-field appearance="outline" class="w-100">
    <input
      matInput
      type="text"
      class="input"
      placeholder="Search employee"
      [formControl]="formControl"
    />
  </mat-form-field>
</div>

<div class="table-responsive">
  <table mat-table [dataSource]="clients" #table>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let element">
        {{ element.name }}, {{ element.prefix }}
      </td>
    </ng-container>

    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef>Address</th>
      <td mat-cell *matCellDef="let element">
        {{ element.address }}
      </td>
    </ng-container>

    <ng-container matColumnDef="city">
      <th mat-header-cell *matHeaderCellDef>City</th>
      <td mat-cell *matCellDef="let element">
        {{ element.city }}
      </td>
    </ng-container>

    <ng-container matColumnDef="npwp">
      <th mat-header-cell *matHeaderCellDef>NPWP</th>
      <td mat-cell *matCellDef="let element">
        {{ element.npwp ?? "N/A" }}
      </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button (click)="openUpdateClient(element.id)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell text-center" [attr.colspan]="displayedColumns.length">
        No data matching the filter.
      </td>
    </tr>
  </table>
  <mat-paginator
    [pageIndex]="page - 1"
    [length]="count"
    [pageSize]="10"
    (page)="changePage($event)"
  ></mat-paginator>
</div>
