<div class="title__wrapper mb-4">
  <h1 class="title"><a routerLink="/Client">Client</a> / Create</h1>
</div>

<form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Prefix</mat-label>
    <mat-select formControlName="prefix">
      <mat-option value="PT.">PT.</mat-option>
      <mat-option value="CV.">CV.</mat-option>
      <mat-option value="UD.">UD.</mat-option>
      <mat-option value="Yayasan">Yayasan</mat-option>
      <mat-option value="Perorangan">Perorangan</mat-option>
      <mat-option value="Lainnya">Lainnya</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Name</mat-label>
    <input
      matInput
      formControlName="name"
      type="text"
      placeholder="Enter client name"
    />
  </mat-form-field>

  <mat-label></mat-label>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Email</mat-label>
    <input
      matInput
      formControlName="email"
      type="email"
      placeholder="Enter client email"
    />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Phone</mat-label>
    <input
      matInput
      formControlName="phoneNumber"
      type="tel"
      placeholder="Enter client phone number"
    />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Address</mat-label>
    <textarea
      matInput
      formControlName="address"
      placeholder="Enter client address"
      rows="3"
      style="resize: none"
    ></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>City</mat-label>
    <input
      matInput
      formControlName="city"
      type="text"
      placeholder="Enter client city"
    />
  </mat-form-field>

  <!-- Province -->
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Province</mat-label>
    <input
      matInput
      formControlName="province"
      type="text"
      placeholder="Enter client province"
    />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>NPWP</mat-label>
    <input
      matInput
      formControlName="npwp"
      type="text"
      placeholder="Enter client NPWP"
    />
  </mat-form-field>

  <button
    class="btn outlined"
    type="submit"
    [disabled]="isSubmitting || formGroup.invalid"
  >
    Submit
  </button>
</form>
