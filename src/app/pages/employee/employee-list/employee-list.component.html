<app-header-title
  [title]="'Employees'"
  [description]="'Manage your employees here'"
  [actionButtonLabel]="'Create new employee'"
  (onActionButtonClicked)="createNewEmployee()"
></app-header-title>

<div class="search__wrapper">
  <mat-form-field appearance="outline" class="w-100">
    <input
      matInput
      type="text"
      class="input"
      placeholder="Search employee"
      [formControl]="formControl"
    />
  </mat-form-field>
</div>

<div class="table-responsive">
  <table mat-table [dataSource]="employees">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let element">
        {{ element.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="nik">
      <th mat-header-cell *matHeaderCellDef>NIK</th>
      <td mat-cell *matCellDef="let element">
        {{ element.nik }}
      </td>
    </ng-container>

    <ng-container matColumnDef="taxCategory">
      <th mat-header-cell *matHeaderCellDef>Tax Category</th>
      <td mat-cell *matCellDef="let element">
        {{ element.taxCategory }}
      </td>
    </ng-container>

    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef>Position</th>
      <td mat-cell *matCellDef="let element">
        {{ element.position }}
      </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <button [matMenuTriggerFor]="menu" matIconButton>
          <mat-icon>more_horiz</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="openUpdateEmployee(element.id)">
            <mat-icon>edit</mat-icon>
            Update employee data
          </button>

        <button mat-menu-item (click)="openSalaryCreate(element.id)">
          <mat-icon>receipt</mat-icon>
          Create salary slip
        </button>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell text-center" [attr.colspan]="displayedColumns.length">
        No data matching the filter.
      </td>
    </tr>
  </table>
  <mat-paginator
    [pageIndex]="page - 1"
    [length]="count"
    [pageSize]="10"
    (page)="changePage($event)"
  ></mat-paginator>
</div>
