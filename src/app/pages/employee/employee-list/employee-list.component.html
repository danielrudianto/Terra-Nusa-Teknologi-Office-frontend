<div class="title__wrapper mb-4">
  <h1 class="title">Employees</h1>
</div>

<div class="position-absolute bottom-0 end-0 m-3">
  <button mat-fab color="primary" routerLink="/Employee/Create">
    <mat-icon>add</mat-icon>
  </button>
</div>

<div class="search__wrapper">
  <mat-form-field appearance="outline" class="w-100">
    <input
      matInput
      type="text"
      class="input"
      placeholder="Search employee"
      [formControl]="formControl"
    />
  </mat-form-field>
</div>

<div class="table-responsive">
  <table mat-table [dataSource]="employees">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let element">
        {{ element.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="nik">
      <th mat-header-cell *matHeaderCellDef>NIK</th>
      <td mat-cell *matCellDef="let element">
        {{ element.nik }}
      </td>
    </ng-container>

    <ng-container matColumnDef="taxCategory">
      <th mat-header-cell *matHeaderCellDef>Tax Category</th>
      <td mat-cell *matCellDef="let element">
        {{ element.taxCategory }}
      </td>
    </ng-container>

    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef>Position</th>
      <td mat-cell *matCellDef="let element">
        {{ element.position }}
      </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button (click)="openUpdateEmployee(element.id)">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button (click)="openSalaryCreate(element.id)">
          <mat-icon>receipt</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell text-center" [attr.colspan]="displayedColumns.length">
        No data matching the filter.
      </td>
    </tr>
  </table>
  <mat-paginator
    [pageIndex]="page - 1"
    [length]="count"
    [pageSize]="10"
    (page)="changePage($event)"
  ></mat-paginator>
</div>
