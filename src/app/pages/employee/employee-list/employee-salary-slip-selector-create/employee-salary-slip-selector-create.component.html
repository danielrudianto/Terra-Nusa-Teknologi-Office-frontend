<div class="ss">
  <div class="ss-head" mat-dialog-title>
    <span class="ss-badge">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="4" width="18" height="18" rx="3" />
        <path d="M16 2v4M8 2v4M3 10h18M8 15h3" />
      </svg>
    </span>
    <div class="ss-head__text">
      <h2 class="ss-title">{{ "salarySlip.buatSalarySlip" | translate }}</h2>
      <span class="ss-sub">{{ "salarySlip.pilihPeriodeGajiKaryawan" | translate }}</span>
    </div>
  </div>

  <form [formGroup]="salarySlipFormGroup" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="ss-content">
      <div class="ss-grid">
        <mat-form-field appearance="outline">
          <mat-label>{{ "salarySlip.month" | translate }}</mat-label>
          <mat-select formControlName="month">
            <mat-option *ngFor="let m of months" [value]="m.value">{{
              m.key | translate
            }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>{{ "salarySlip.year" | translate }}</mat-label>
          <input
            matInput
            type="number"
            formControlName="year"
            [placeholder]="'salarySlip.ex2026' | translate"
          />
        </mat-form-field>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions class="ss-actions">
      <button type="button" class="ss-cancel" mat-dialog-close>{{ "salarySlip.batal" | translate }}</button>
      <button
        type="submit"
        class="ss-submit"
        [disabled]="salarySlipFormGroup.invalid || isSubmitting"
        cdkFocusInitial
      >
        {{ isSubmitting ? ('hardcoded.memproses' | translate) : ('hardcoded.lanjut' | translate) }}
      </button>
    </mat-dialog-actions>
  </form>
</div>
