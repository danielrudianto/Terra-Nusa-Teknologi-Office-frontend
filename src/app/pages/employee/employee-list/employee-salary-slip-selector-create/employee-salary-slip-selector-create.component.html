<h2 mat-dialog-title>Salary slip</h2>
<form [formGroup]="salarySlipFormGroup" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Month</mat-label>
      <mat-select formControlName="month">
        <mat-option *ngFor="let m of months" [value]="m.value">
          {{ m.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Year</mat-label>
      <input
        matInput
        type="number"
        formControlName="year"
        placeholder="Enter year"
      />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button
      mat-stroked-button
      type="submit"
      [disabled]="salarySlipFormGroup.invalid"
      cdkFocusInitial
    >
      Submit
    </button>
  </mat-dialog-actions>
</form>
