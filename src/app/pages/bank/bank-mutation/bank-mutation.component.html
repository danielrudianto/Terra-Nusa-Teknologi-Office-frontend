<div class="bank-header">
  <app-header-title
    class="flex-grow-1"
    [title]="bankAccount == null ? 'N/A' : bankAccount.bankAccountName"
    [description]="
      bankAccount == null
        ? ''
        : bankAccount.bankAccountNumber + ' - ' + bankAccount.bankName
    "
  ></app-header-title>
  <mat-form-field appearance="outline">
    <mat-label>Enter a date range</mat-label>
    <mat-date-range-input [formGroup]="range" [rangePicker]="picker">
      <input
        matStartDate
        formControlName="start"
        placeholder="Start date"
        #dateRangeStart
      />
      <input
        matEndDate
        formControlName="end"
        placeholder="End date"
        #dateRangeEnd
        (dateChange)="dateRangeChange(dateRangeStart, dateRangeEnd)"
      />
    </mat-date-range-input>
    <mat-datepicker-toggle matIconPrefix [for]="picker"></mat-datepicker-toggle>
    <mat-date-range-picker #picker></mat-date-range-picker>

    <button mat-icon-button matSuffix type="button" (click)="download()">
      <mat-icon>download</mat-icon>
    </button>
  </mat-form-field>
</div>

<div class="table-responsive">
  <mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="date">
      <mat-header-cell *matHeaderCellDef> Date </mat-header-cell>
      <mat-cell *matCellDef="let opponent">
        {{ opponent.date | date }}
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="opponent">
      <mat-header-cell *matHeaderCellDef> Opponent </mat-header-cell>
      <mat-cell *matCellDef="let opponent">
        {{ opponent.opponent }}
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="document">
      <mat-header-cell *matHeaderCellDef> Document </mat-header-cell>
      <mat-cell *matCellDef="let opponent">
        {{ opponent.document }}
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="amount">
      <mat-header-cell *matHeaderCellDef> Amount </mat-header-cell>
      <mat-cell *matCellDef="let opponent">
        {{ opponent.amount | currency : "Rp." }}
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="balance">
      <mat-header-cell *matHeaderCellDef> Balance </mat-header-cell>
      <mat-cell *matCellDef="let opponent">
        {{ opponent.balance | currency : "Rp." }}
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell text-center" [attr.colspan]="displayedColumns.length">
        No data matching the filter.
      </td>
    </tr>
  </mat-table>

  <mat-paginator
    [pageSizeOptions]="[10, 25, 100]"
    [pageSize]="pageSize"
    [showFirstLastButtons]="true"
    [length]="dataCount"
    [pageIndex]="page - 1"
    (page)="onPageChange($event)"
  ></mat-paginator>
</div>
