<div class="title__wrapper mb-4">
  <h1 class="title">Bank Accounts</h1>
</div>

<div class="position-absolute bottom-0 end-0 m-3">
  <button mat-fab color="primary" routerLink="/Bank/Create">
    <mat-icon>add</mat-icon>
  </button>
</div>

<div class="search__wrapper">
  <mat-form-field appearance="outline" class="w-100">
    <input
      matInput
      type="text"
      class="input"
      placeholder="Search supplier"
      [formControl]="formControl"
    />
  </mat-form-field>
</div>

<div class="table-responsive">
  <table mat-table [dataSource]="banks">
    <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

    <ng-container matColumnDef="bankAccountName">
      <th mat-header-cell *matHeaderCellDef>
        <div class="d-flex d-align-items-center">
          <span>Account Name</span>
        </div>
      </th>
      <td mat-cell *matCellDef="let bank">
        {{ bank.bankAccountName }}
      </td>
    </ng-container>

    <ng-container matColumnDef="bankName">
      <th mat-header-cell *matHeaderCellDef>
        <div class="d-flex d-align-items-center">
          <span>Bank Name</span>
        </div>
      </th>
      <td mat-cell *matCellDef="let bank">
        {{ bank.bankAccountName }}
      </td>
    </ng-container>

    <ng-container matColumnDef="bankAccountNumber">
      <th mat-header-cell *matHeaderCellDef>
        <div class="d-flex d-align-items-center">
          <span>Account number</span>
        </div>
      </th>
      <td mat-cell *matCellDef="let bank">
        {{ bank.bankAccountNumber }}
      </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let bank">
        <button
          mat-icon-button
          (click)="onViewDetail(bank.id)"
          aria-label="Example icon button with a vertical three dot icon"
        >
          <mat-icon>open_in_full</mat-icon>
        </button>
        <button
          mat-icon-button
          (click)="onEdit(bank.id)"
          aria-label="Example icon button with a vertical three dot icon"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          (click)="onViewDetail(bank.id)"
          aria-label="Example icon button with a vertical three dot icon"
        >
          <mat-icon>close</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell text-center" [attr.colspan]="displayedColumns.length">
        No data matching the filter.
      </td>
    </tr>
  </table>
</div>
<mat-paginator
  [length]="count"
  [pageSize]="10"
  [pageIndex]="page - 1"
  (page)="changePage($event)"
>
</mat-paginator>
