<div class="bu">
  <div class="bu-head" mat-dialog-title appDialogGeser>
    <span class="bu-badge">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 10 12 4l9 6M5 10v9h14v-9M9 19v-5h6v5" />
      </svg>
    </span>
    <div class="bu-head__text">
      <h2 class="bu-title">{{ "bankForm.editTitle" | translate }}</h2>
      <span class="bu-sub">{{ "bankForm.editSubtitle" | translate }}</span>
    </div>
  </div>

  <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="bu-content">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>{{ "bankForm.bankName" | translate }}</mat-label>
        <input
          #input
          type="text"
          [placeholder]="'bankForm.bankNamePlaceholder' | translate"
          matInput
          formControlName="bankName"
          [matAutocomplete]="auto"
          (input)="filter()"
          (focus)="filter()"
        />
        <mat-autocomplete requireSelection #auto="matAutocomplete">
          <mat-option
            *ngFor="let option of filteredOptions"
            [value]="option.name"
            >{{ option.name }}</mat-option
          >
        </mat-autocomplete>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>{{ "bankForm.accountName" | translate }}</mat-label>
        <input
          matInput
          formControlName="bankAccountName"
          type="text"
          [placeholder]="'bankForm.accountNamePlaceholder' | translate"
          required
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>{{ "bankForm.accountNumber" | translate }}</mat-label>
        <input
          matInput
          formControlName="bankAccountNumber"
          type="text"
          inputmode="numeric"
          [placeholder]="'bankForm.accountNumberPlaceholder' | translate"
          required
        />
        <mat-error
          *ngIf="formGroup.get('bankAccountNumber')?.hasError('pattern')"
          >{{ "common.onlyNumbers" | translate }}</mat-error
        >
      </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions class="bu-actions">
      <button type="button" class="bu-cancel" (click)="onClose()">
        {{ "bankForm.cancel" | translate }}
      </button>
      <button
        type="submit"
        class="bu-submit"
        [disabled]="isSubmitting || formGroup.invalid"
      >
        {{ isSubmitting ? ('hardcoded.menyimpan' | translate) : ('hardcoded.simpanPerubahan' | translate) }}
      </button>
    </mat-dialog-actions>
  </form>
</div>
