<h2 mat-dialog-title>Create reimbursement item</h2>
<form [formGroup]="formGroup">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Date</mat-label>
      <input
        matInput
        formControlName="date"
        placeholder="Date"
        [matDatepicker]="picker"
        formControlName="date"
      />
      <mat-datepicker-toggle
        matIconPrefix
        [for]="picker"
      ></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-hint>DD/MM/YYYY</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Description</mat-label>
      <textarea
        matInput
        type="text"
        id="description"
        formControlName="description"
        class="form-control"
        placeholder="Enter description"
        rows="3"
        style="resize: none"
        maxlength="255"
      ></textarea>
      <mat-hint
        >{{ formGroup.get("description")?.value.length }} / 255</mat-hint
      >
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Amount</mat-label>
      <input
        matInput
        type="text"
        id="amount"
        formControlName="amount"
        class="form-control"
        placeholder="Enter amount"
        prefix="Rp. "
        thousandSeparator=" "
        decimalScale="2"
        mask="separator"
      />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button
      class="btn btn-outlined"
      (click)="onSubmit()"
      [disabled]="formGroup.invalid"
    >
      Submit
    </button>
    <button class="btn ms-3" (click)="onCancel()">Cancel</button>
  </mat-dialog-actions>
</form>
