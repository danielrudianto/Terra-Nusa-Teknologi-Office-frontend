<div class="container">
  <div class="row">
    <div class="col-12">
      <mat-grid-list
        [cols]="breakpoint"
        rowHeight="2:1"
        [gutterSize]="'20px'"
        (window:resize)="onResize($event)"
      >
        <mat-grid-tile>
          <mat-card class="h-100 w-100">
            <mat-card-header>
              <mat-card-title>PPN</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <hr class="orange" />
              <p>Get PPN report by <b>purchase</b></p>
            </mat-card-content>
            <mat-card-footer>
              <button
                mat-button
                color="primary"
                style="letter-spacing: 0"
                class="py-3"
                (click)="openPPNReport()"
              >
                Open
              </button>
            </mat-card-footer>
          </mat-card>
        </mat-grid-tile>
        <mat-grid-tile>
          <mat-card class="h-100 w-100">
            <mat-card-header>
              <mat-card-title>PPh (Purchase)</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <hr class="orange" />
              <p>Get PPh report by <b>purchase</b></p>
            </mat-card-content>
            <mat-card-footer>
              <button
                mat-button
                color="primary"
                style="letter-spacing: 0"
                class="py-3"
                (click)="openPPHReport()"
              >
                Open
              </button>
            </mat-card-footer>
          </mat-card>
        </mat-grid-tile>
        <mat-grid-tile>
          <mat-card class="h-100 w-100">
            <mat-card-header>
              <mat-card-title>PPh (Salary)</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <hr class="orange" />
              <p>Get PPh report by <b>salary</b></p>
            </mat-card-content>
            <mat-card-footer>
              <button
                mat-button
                color="primary"
                style="letter-spacing: 0"
                class="py-3"
                (click)="openPPHSalaryReport()"
              >
                Open
              </button>
            </mat-card-footer>
          </mat-card>
        </mat-grid-tile>

        <mat-grid-tile>
          <mat-card class="h-100 w-100">
            <mat-card-header>
              <mat-card-title>Monthly Report</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <hr class="orange" />
              <p>Get monthly report</p>
            </mat-card-content>
            <mat-card-footer>
              <button
                mat-button
                color="primary"
                style="letter-spacing: 0"
                class="py-3"
                (click)="openMonthlyReport()"
              >
                Open
              </button>
            </mat-card-footer>
          </mat-card>
        </mat-grid-tile>
      </mat-grid-list>
    </div>
  </div>
</div>
