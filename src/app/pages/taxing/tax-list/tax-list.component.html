<div class="tx">
  <!-- ===== hero ===== -->
  <div class="tx-hero">
    <div class="tx-hero__content">
      <h1 class="tx-hero__title">Pusat Pajak</h1>
      <p class="tx-hero__desc">
        Tarik rekap &amp; laporan pajak perusahaan — PPN, PPh, sampai rekap
        bulanan.
      </p>
    </div>
    <svg
      class="tx-hero__art"
      viewBox="0 0 320 200"
      fill="none"
      aria-hidden="true"
    >
      <!-- document -->
      <rect
        x="150"
        y="34"
        width="96"
        height="128"
        rx="10"
        fill="#ffffff"
        fill-opacity="0.16"
      />
      <rect
        x="168"
        y="58"
        width="60"
        height="7"
        rx="3.5"
        fill="#ffffff"
        fill-opacity="0.55"
      />
      <rect
        x="168"
        y="76"
        width="60"
        height="7"
        rx="3.5"
        fill="#ffffff"
        fill-opacity="0.4"
      />
      <rect
        x="168"
        y="94"
        width="40"
        height="7"
        rx="3.5"
        fill="#ffffff"
        fill-opacity="0.4"
      />
      <!-- percent badge -->
      <circle cx="228" cy="132" r="26" fill="#ffffff" fill-opacity="0.9" />
      <circle cx="220" cy="124" r="4.5" fill="#154dec" />
      <circle cx="236" cy="140" r="4.5" fill="#154dec" />
      <path
        d="M234 120 218 144"
        stroke="#154dec"
        stroke-width="4"
        stroke-linecap="round"
      />
      <!-- sparkles -->
      <path
        d="M116 60l2 5.4 5.4 2-5.4 2L116 75l-2-5.6-5.4-2 5.4-2z"
        fill="#ffffff"
        fill-opacity="0.7"
      />
      <circle cx="126" cy="120" r="3" fill="#ffffff" fill-opacity="0.5" />
    </svg>
  </div>

  <!-- ===== report cards ===== -->
  <div class="tx-grid">
    <button type="button" class="tx-card" (click)="openPPNReport()">
      <span class="tx-card__icon tx-card__icon--blue">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M19 5 5 19M6.5 8a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM17.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"
          />
        </svg>
      </span>
      <span class="tx-card__body">
        <span class="tx-card__title">PPN</span>
        <span class="tx-card__desc">Rekap PPN dari data <b>purchase</b>.</span>
      </span>
      <span class="tx-card__cta"
        >Buka laporan
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </button>

    <button type="button" class="tx-card" (click)="openPPHReport()">
      <span class="tx-card__icon tx-card__icon--violet">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          />
          <path d="M14 2v6h6M9 13h6M9 17h4" />
        </svg>
      </span>
      <span class="tx-card__body">
        <span class="tx-card__title">PPh (Purchase)</span>
        <span class="tx-card__desc">Rekap PPh dari data <b>purchase</b>.</span>
      </span>
      <span class="tx-card__cta"
        >Buka laporan
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </button>

    <button type="button" class="tx-card" (click)="openPPHSalaryReport()">
      <span class="tx-card__icon tx-card__icon--green">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 11h-6M19 8v6"
          />
        </svg>
      </span>
      <span class="tx-card__body">
        <span class="tx-card__title">PPh (Salary)</span>
        <span class="tx-card__desc">Rekap PPh dari <b>gaji karyawan</b>.</span>
      </span>
      <span class="tx-card__cta"
        >Buka laporan
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </button>

    <button type="button" class="tx-card" (click)="openMonthlyReport()">
      <span class="tx-card__icon tx-card__icon--amber">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="18" rx="3" />
          <path d="M16 2v4M8 2v4M3 10h18M8 15h3M8 18h6" />
        </svg>
      </span>
      <span class="tx-card__body">
        <span class="tx-card__title">Monthly Report</span>
        <span class="tx-card__desc"
          >Rekap pajak <b>bulanan</b> menyeluruh.</span
        >
      </span>
      <span class="tx-card__cta"
        >Buka laporan
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </button>
  </div>
</div>
