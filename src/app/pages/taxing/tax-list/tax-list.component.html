<div class="tx">
  <app-header-title
    [title]="'taxing.title' | translate"
    [description]="'taxing.description' | translate"
  />

  <!-- ===== period selector (choose once) ===== -->
  <div class="tx-period">
    <div class="tx-period__label">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="4" width="18" height="18" rx="3" />
        <path d="M16 2v4M8 2v4M3 10h18" />
      </svg>
      <span>{{ "taxing.period" | translate }}</span>
    </div>

    <div class="tx-year">
      <button
        type="button"
        class="tx-year__btn"
        (click)="prevYear()"
        [attr.aria-label]="'tax.tahunSebelumnya' | translate"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
      <span class="tx-year__value">{{ year }}</span>
      <button
        type="button"
        class="tx-year__btn"
        (click)="nextYear()"
        [attr.aria-label]="'tax.tahunBerikutnya' | translate"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 6l6 6-6 6" />
        </svg>
      </button>
    </div>

    <div class="tx-months">
      @for (m of months; track m.n) {
        <button
          type="button"
          class="tx-month"
          [class.is-active]="m.n === month"
          (click)="selectMonth(m.n)"
        >
          {{ m.key | translate }}
        </button>
      }
    </div>
  </div>

  <!-- ===== report cards ===== -->
  <div class="tx-grid">
    <button type="button" class="tx-card" (click)="openPPNReport()">
      <span class="tx-card__icon tx-card__icon--blue">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M19 5 5 19M6.5 8a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM17.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"
          />
        </svg>
      </span>
      <span class="tx-card__body">
        <span class="tx-card__title">{{ "taxing.ppnTitle" | translate }}</span>
        <span
          class="tx-card__desc"
          [innerHTML]="'taxing.ppnDesc' | translate"
        ></span>
      </span>
      <span class="tx-card__cta"
        >{{ "taxing.openReport" | translate }}
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </button>

    <button type="button" class="tx-card" (click)="openPPHReport()">
      <span class="tx-card__icon tx-card__icon--violet">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          />
          <path d="M14 2v6h6M9 13h6M9 17h4" />
        </svg>
      </span>
      <span class="tx-card__body">
        <span class="tx-card__title">{{
          "taxing.pphPurchaseTitle" | translate
        }}</span>
        <span
          class="tx-card__desc"
          [innerHTML]="'taxing.pphPurchaseDesc' | translate"
        ></span>
      </span>
      <span class="tx-card__cta"
        >{{ "taxing.openReport" | translate }}
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </button>

    <button type="button" class="tx-card" (click)="openPPHSalaryReport()">
      <span class="tx-card__icon tx-card__icon--green">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 11h-6M19 8v6"
          />
        </svg>
      </span>
      <span class="tx-card__body">
        <span class="tx-card__title">{{
          "taxing.pphSalaryTitle" | translate
        }}</span>
        <span
          class="tx-card__desc"
          [innerHTML]="'taxing.pphSalaryDesc' | translate"
        ></span>
      </span>
      <span class="tx-card__cta"
        >{{ "taxing.openReport" | translate }}
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </button>

    <button type="button" class="tx-card" (click)="openMonthlyReport()">
      <span class="tx-card__icon tx-card__icon--amber">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="18" rx="3" />
          <path d="M16 2v4M8 2v4M3 10h18M8 15h3M8 18h6" />
        </svg>
      </span>
      <span class="tx-card__body">
        <span class="tx-card__title">{{
          "taxing.monthlyTitle" | translate
        }}</span>
        <span
          class="tx-card__desc"
          [innerHTML]="'taxing.monthlyDesc' | translate"
        ></span>
      </span>
      <span class="tx-card__cta"
        >{{ "taxing.openReport" | translate }}
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </button>
  </div>
</div>
