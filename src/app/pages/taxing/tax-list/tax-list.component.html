<div class="tx">
  <!-- ===== hero ===== -->
  <div class="tx-hero">
    <div class="tx-hero__content">
      <h1 class="tx-hero__title">{{ "taxing.title" | translate }}</h1>
      <p class="tx-hero__desc">
        {{ "taxing.description" | translate }}
      </p>
    </div>
    <svg
      class="tx-hero__art"
      viewBox="0 0 320 200"
      fill="none"
      aria-hidden="true"
    >
      <!-- document -->
      <rect
        x="150"
        y="34"
        width="96"
        height="128"
        rx="10"
        fill="#ffffff"
        fill-opacity="0.16"
      />
      <rect
        x="168"
        y="58"
        width="60"
        height="7"
        rx="3.5"
        fill="#ffffff"
        fill-opacity="0.55"
      />
      <rect
        x="168"
        y="76"
        width="60"
        height="7"
        rx="3.5"
        fill="#ffffff"
        fill-opacity="0.4"
      />
      <rect
        x="168"
        y="94"
        width="40"
        height="7"
        rx="3.5"
        fill="#ffffff"
        fill-opacity="0.4"
      />
      <!-- percent badge -->
      <circle cx="228" cy="132" r="26" fill="#ffffff" fill-opacity="0.9" />
      <circle cx="220" cy="124" r="4.5" fill="#154dec" />
      <circle cx="236" cy="140" r="4.5" fill="#154dec" />
      <path
        d="M234 120 218 144"
        stroke="#154dec"
        stroke-width="4"
        stroke-linecap="round"
      />
      <!-- sparkles -->
      <path
        d="M116 60l2 5.4 5.4 2-5.4 2L116 75l-2-5.6-5.4-2 5.4-2z"
        fill="#ffffff"
        fill-opacity="0.7"
      />
      <circle cx="126" cy="120" r="3" fill="#ffffff" fill-opacity="0.5" />
    </svg>
  </div>

  <!-- ===== period selector (choose once) ===== -->
  <div class="tx-period">
    <div class="tx-period__label">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="4" width="18" height="18" rx="3" />
        <path d="M16 2v4M8 2v4M3 10h18" />
      </svg>
      <span>{{ "taxing.period" | translate }}</span>
    </div>

    <div class="tx-year">
      <button
        type="button"
        class="tx-year__btn"
        (click)="prevYear()"
        aria-label="Tahun sebelumnya"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
      <span class="tx-year__value">{{ year }}</span>
      <button
        type="button"
        class="tx-year__btn"
        (click)="nextYear()"
        aria-label="Tahun berikutnya"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 6l6 6-6 6" />
        </svg>
      </button>
    </div>

    <div class="tx-months">
      <button
        type="button"
        class="tx-month"
        *ngFor="let m of months"
        [class.is-active]="m.n === month"
        (click)="selectMonth(m.n)"
      >
        {{ m.label }}
      </button>
    </div>
  </div>

  <!-- ===== report cards ===== -->
  <div class="tx-grid">
    <button type="button" class="tx-card" (click)="openPPNReport()">
      <span class="tx-card__icon tx-card__icon--blue">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M19 5 5 19M6.5 8a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM17.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"
          />
        </svg>
      </span>
      <span class="tx-card__body">
        <span class="tx-card__title">{{ "taxing.ppnTitle" | translate }}</span>
        <span
          class="tx-card__desc"
          [innerHTML]="'taxing.ppnDesc' | translate"
        ></span>
      </span>
      <span class="tx-card__cta"
        >{{ "taxing.openReport" | translate }}
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </button>

    <button type="button" class="tx-card" (click)="openPPHReport()">
      <span class="tx-card__icon tx-card__icon--violet">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          />
          <path d="M14 2v6h6M9 13h6M9 17h4" />
        </svg>
      </span>
      <span class="tx-card__body">
        <span class="tx-card__title">{{
          "taxing.pphPurchaseTitle" | translate
        }}</span>
        <span
          class="tx-card__desc"
          [innerHTML]="'taxing.pphPurchaseDesc' | translate"
        ></span>
      </span>
      <span class="tx-card__cta"
        >{{ "taxing.openReport" | translate }}
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </button>

    <button type="button" class="tx-card" (click)="openPPHSalaryReport()">
      <span class="tx-card__icon tx-card__icon--green">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 11h-6M19 8v6"
          />
        </svg>
      </span>
      <span class="tx-card__body">
        <span class="tx-card__title">{{
          "taxing.pphSalaryTitle" | translate
        }}</span>
        <span
          class="tx-card__desc"
          [innerHTML]="'taxing.pphSalaryDesc' | translate"
        ></span>
      </span>
      <span class="tx-card__cta"
        >{{ "taxing.openReport" | translate }}
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </button>

    <button type="button" class="tx-card" (click)="openMonthlyReport()">
      <span class="tx-card__icon tx-card__icon--amber">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="18" rx="3" />
          <path d="M16 2v4M8 2v4M3 10h18M8 15h3M8 18h6" />
        </svg>
      </span>
      <span class="tx-card__body">
        <span class="tx-card__title">{{
          "taxing.monthlyTitle" | translate
        }}</span>
        <span
          class="tx-card__desc"
          [innerHTML]="'taxing.monthlyDesc' | translate"
        ></span>
      </span>
      <span class="tx-card__cta"
        >{{ "taxing.openReport" | translate }}
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </span>
    </button>
  </div>
</div>
