<div class="txr">
  <div class="txr-head" mat-dialog-title appDialogGeser>
    <span class="txr-badge">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="4" width="18" height="18" rx="3" />
        <path d="M16 2v4M8 2v4M3 10h18M8 15h3M8 18h6" />
      </svg>
    </span>
    <div class="txr-head__text">
      <h2 class="txr-title">{{ "taxing.monthlyReport" | translate }}</h2>
      <span class="txr-sub">{{ "taxing.recapSub" | translate }}</span>
    </div>
  </div>

  <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="txr-content">
      <div class="txr-yearrow">
        <span class="txr-label">{{ "common.period" | translate }}</span>
        <div class="txr-year">
          <button
            type="button"
            (click)="formGroup.patchValue({ year: +formGroup.value.year - 1 })"
            [attr.aria-label]="'tax.tahunSebelumnya' | translate"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <span>{{ formGroup.value.year }}</span>
          <button
            type="button"
            (click)="formGroup.patchValue({ year: +formGroup.value.year + 1 })"
            [attr.aria-label]="'tax.tahunBerikutnya' | translate"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 6l6 6-6 6" />
            </svg>
          </button>
        </div>
      </div>
      <div class="txr-months">
        <button
          type="button"
          class="txr-month"
          *ngFor="let m of months"
          [class.is-active]="+formGroup.value.month === m.n"
          (click)="formGroup.patchValue({ month: m.n })"
        >
          {{ m.key | translate }}
        </button>
      </div>

      <div class="txr-sections">
        <span class="txr-label">{{ "taxing.reportSection" | translate }}</span>
        <!--
          Kartu pilih, bukan sakelar.

          Tujuh `mat-slide-toggle` berjajar dua kolom membuat yang dibaca
          duluan SAKELARNYA, bukan namanya: tujuh bulatan abu-abu identik,
          dan namanya menempel di sebelah kanan masing-masing. Pertanyaan
          yang sebenarnya diajukan layar ini — "bagian mana yang ikut
          diunduh" — adalah pemilihan, dan pemilihan di dialog ini sudah
          punya bentuknya sendiri satu baris di atas: pill bulan.

          Bentuknya karena itu disamakan. Yang terpilih menjadi biru penuh,
          sama seperti bulan yang aktif, jadi "apa saja yang ikut" terbaca
          dalam satu pandangan tanpa menelusuri tujuh sakelar satu per satu.

          Tetap tombol `aria-pressed`, bukan checkbox yang disamarkan:
          pembaca layar menyebutnya "ditekan/tidak ditekan", dan keyboard
          memperlakukannya seperti tombol biasa.
        -->
        <div class="txr-toggles">
          <button
            type="button"
            class="txr-pilih"
            *ngFor="let b of BAGIAN"
            [class.is-active]="formGroup.get(b.kunci)?.value === true"
            [attr.aria-pressed]="formGroup.get(b.kunci)?.value === true"
            (click)="toggleBagian(b.kunci)"
          >
            <span class="txr-pilih__tanda" aria-hidden="true">
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 6L9 17l-5-5" />
              </svg>
            </span>
            <span class="txr-pilih__nama">{{ b.label | translate }}</span>
          </button>
        </div>
      </div>
    </mat-dialog-content>
    <mat-dialog-actions class="txr-actions">
      <button
        type="submit"
        class="txr-submit"
        [disabled]="isDownloading || formGroup.invalid"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"
          />
        </svg>
        {{ isDownloading ? ('hardcoded.menyiapkan' | translate) : ('hardcoded.download' | translate) }}
      </button>
    </mat-dialog-actions>
  </form>
</div>
