<div class="txr">
  <div class="txr-head" mat-dialog-title>
    <span class="txr-badge">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M19 5 5 19M6.5 8a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM17.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"
        />
      </svg>
    </span>
    <div class="txr-head__text">
      <h2 class="txr-title">{{ "taxing.ppnRecap" | translate }}</h2>
      <span class="txr-sub">{{ "taxing.ppnSub" | translate }}</span>
    </div>
  </div>

  <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="txr-content">
      <div class="txr-yearrow">
        <span class="txr-label">{{ "common.period" | translate }}</span>
        <div class="txr-year">
          <button
            type="button"
            (click)="formGroup.patchValue({ year: +formGroup.value.year - 1 })"
            aria-label="Tahun sebelumnya"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <span>{{ formGroup.value.year }}</span>
          <button
            type="button"
            (click)="formGroup.patchValue({ year: +formGroup.value.year + 1 })"
            aria-label="Tahun berikutnya"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 6l6 6-6 6" />
            </svg>
          </button>
        </div>
      </div>
      <div class="txr-months">
        <button
          type="button"
          class="txr-month"
          *ngFor="let m of months"
          [class.is-active]="+formGroup.value.month === m.n"
          (click)="formGroup.patchValue({ month: m.n })"
        >
          {{ m.label }}
        </button>
      </div>
    </mat-dialog-content>
    <mat-dialog-actions class="txr-actions">
      <button
        type="submit"
        class="txr-submit"
        [disabled]="formGroup.invalid || isLoading"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"
          />
        </svg>
        {{ isLoading ? "Menyiapkan..." : "Download" }}
      </button>
    </mat-dialog-actions>
  </form>
</div>
