<div class="mif">
  <div class="mif-head" mat-dialog-title>
    <span class="mif-badge">
      <mat-icon>filter_list</mat-icon>
    </span>
    <div class="mif-head__text">
      <h2 class="mif-title">Filter item</h2>
      <span class="mif-sub">Saring berdasarkan brand, tipe, atau tipe PO</span>
    </div>
  </div>

  <mat-dialog-content class="mif-content">
    <mat-form-field appearance="outline" class="mif-field">
      <mat-label>Brand</mat-label>
      <mat-select [formControl]="brandControl">
        <mat-option value="">Semua brand</mat-option>
        <mat-option *ngFor="let b of data.brands" [value]="b">{{
          b
        }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="mif-field">
      <mat-label>Tipe</mat-label>
      <mat-select [formControl]="typeControl">
        <mat-option value="">Semua tipe</mat-option>
        <mat-option *ngFor="let t of data.types" [value]="t">{{
          t
        }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="mif-field">
      <mat-label>Tipe PO</mat-label>
      <mat-select [formControl]="purchaseTypeControl">
        <mat-option value="">Semua tipe PO</mat-option>
        <mat-option
          *ngFor="let p of data.purchaseTypeOptions"
          [value]="p.code"
          >{{ p.label }}</mat-option
        >
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions class="mif-actions">
    <button
      type="button"
      mat-button
      class="mif-btn mif-btn--reset"
      [disabled]="!hasActiveFilter()"
      (click)="reset()"
    >
      <mat-icon>restart_alt</mat-icon> Reset
    </button>
    <span class="mif-spacer"></span>
    <button
      type="button"
      mat-button
      class="mif-btn mif-btn--ghost"
      (click)="cancel()"
    >
      Batal
    </button>
    <button
      type="button"
      mat-flat-button
      class="mif-btn mif-btn--primary"
      (click)="apply()"
    >
      Terapkan
    </button>
  </mat-dialog-actions>
</div>
