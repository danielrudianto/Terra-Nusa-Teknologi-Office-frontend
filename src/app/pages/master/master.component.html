<div class="master">
  <!-- secondary side nav -->
  <aside class="master-nav">
    <div class="master-nav__head">
      <span class="master-nav__title">{{ "master.title" | translate }}</span>
      <span class="master-nav__sub">{{ "master.subtitle" | translate }}</span>
    </div>
    <nav class="master-nav__list">
      <a
        *ngFor="let item of navItems"
        class="master-nav__item"
        [routerLink]="item.route"
        routerLinkActive="master-nav__item--active"
      >
        <span class="master-nav__icon">
          <mat-icon>{{ item.icon }}</mat-icon>
        </span>
        <span class="master-nav__text">
          <span class="master-nav__name">{{ item.name | translate }}</span>
          <span class="master-nav__desc">{{
            item.description | translate
          }}</span>
        </span>
      </a>
    </nav>
  </aside>

  <!-- content -->
  <section class="master-content">
    <div class="master-anim" [@routeFade]="getRouteState(outlet)">
      <router-outlet #outlet="outlet"></router-outlet>
    </div>
  </section>
</div>
