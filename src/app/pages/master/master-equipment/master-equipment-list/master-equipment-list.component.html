<div class="me">
  <app-header-title
    [title]="'Master Equipment'"
    [description]="'Katalog alat berat untuk sewa'"
  ></app-header-title>

  <div class="me-toolbar">
    <mat-form-field appearance="outline" class="me-search">
      <mat-icon matPrefix>search</mat-icon>
      <mat-label>Search</mat-label>
      <input
        matInput
        placeholder="Cari nama, kategori, kapasitas, atau brand"
        [formControl]="searchControl"
      />
    </mat-form-field>
    <span class="me-spacer"></span>
    <button type="button" class="me-btn me-btn--brand" (click)="createItem()">
      <mat-icon>add</mat-icon> Tambah equipment
    </button>
  </div>

  <div class="me-card">
    <mat-progress-bar
      *ngIf="isLoading"
      mode="indeterminate"
      class="me-progress"
    ></mat-progress-bar>
    <div class="table-responsive">
      <table mat-table [dataSource]="items">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nama</th>
          <td mat-cell *matCellDef="let it">
            <div class="me-name">
              <span class="me-badge">{{ (it.name || "?").charAt(0) }}</span>
              <span class="me-primary">{{ it.name }}</span>
            </div>
          </td>
        </ng-container>
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Kategori</th>
          <td mat-cell *matCellDef="let it">
            <span class="me-chip">{{ it.category || "—" }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="capacity">
          <th mat-header-cell *matHeaderCellDef>Kapasitas</th>
          <td mat-cell *matCellDef="let it">
            <span class="me-muted">{{ it.capacity || "—" }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="brand">
          <th mat-header-cell *matHeaderCellDef>Brand</th>
          <td mat-cell *matCellDef="let it">
            <span class="me-muted">{{ it.brand || "—" }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="unit">
          <th mat-header-cell *matHeaderCellDef>Satuan</th>
          <td mat-cell *matCellDef="let it">
            <span class="me-muted">/ {{ it.unit || "hari" }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let it" (click)="$event.stopPropagation()">
            <button mat-icon-button [matMenuTriggerFor]="menu">
              <mat-icon>more_horiz</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="deleteItem(it)">
                <mat-icon>delete</mat-icon><span>Hapus</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>
        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns; sticky: true"
        ></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr class="mat-row me-norow" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            <div class="me-empty">
              <mat-icon>precision_manufacturing</mat-icon
              ><span>Belum ada equipment. Klik "Tambah equipment".</span>
            </div>
          </td>
        </tr>
      </table>
    </div>
    <mat-paginator
      [length]="count"
      [pageSize]="pageSize"
      [pageIndex]="page - 1"
      [pageSizeOptions]="[10, 25, 50]"
      (page)="changePage($event)"
    ></mat-paginator>
  </div>
</div>
