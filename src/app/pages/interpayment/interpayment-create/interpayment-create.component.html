<div class="ic">
  <div class="ic-head" mat-dialog-title>
    <span class="ic-badge">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 8h14l-3-3M21 16H7l3 3" />
      </svg>
    </span>
    <div class="ic-head__text">
      <h2 class="ic-title">Transfer Antar Rekening</h2>
      <span class="ic-sub">Catat perpindahan dana internal</span>
    </div>
  </div>

  <form [formGroup]="formGroup">
    <mat-dialog-content class="ic-content">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Tanggal</mat-label>
        <input
          matInput
          [matDatepicker]="picker"
          formControlName="date"
          placeholder="Date"
        />
        <mat-datepicker-toggle
          matIconPrefix
          [for]="picker"
        ></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <!-- transfer flow -->
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Dari rekening</mat-label>
        <mat-select formControlName="bankAccountIDOrigin">
          <mat-option
            *ngFor="let bank of bankAccounts"
            [value]="bank.id"
            [disabled]="bank.id === destinationID"
          >
            {{ bank.bankAccountName }} · {{ bank.bankAccountNumber }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="ic-arrow" aria-hidden="true">
        <span class="ic-arrow__pill">
          <mat-icon>arrow_downward</mat-icon>
        </span>
      </div>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Ke rekening</mat-label>
        <mat-select formControlName="bankAccountIDDestination">
          <mat-option
            *ngFor="let bank of bankAccounts"
            [value]="bank.id"
            [disabled]="bank.id === originID"
          >
            {{ bank.bankAccountName }} · {{ bank.bankAccountNumber }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="ic-error" *ngIf="formGroup.hasError('sameBankAccount')">
        <mat-icon>error_outline</mat-icon>
        <span>Rekening asal dan tujuan tidak boleh sama.</span>
      </div>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Jumlah</mat-label>
        <input
          matInput
          type="text"
          formControlName="amount"
          placeholder="Enter amount"
          prefix="Rp. "
          thousandSeparator=" "
          mask="separator"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Deskripsi</mat-label>
        <input
          matInput
          type="text"
          formControlName="description"
          placeholder="Keterangan transfer"
        />
      </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions class="ic-actions">
      <button type="button" class="ic-cancel" (click)="onCancel()">
        Batal
      </button>
      <button
        type="button"
        class="ic-submit"
        (click)="onSubmit()"
        [disabled]="formGroup.invalid || isSubmitting"
      >
        {{ isSubmitting ? "Menyimpan..." : "Simpan transfer" }}
      </button>
    </mat-dialog-actions>
  </form>
</div>
