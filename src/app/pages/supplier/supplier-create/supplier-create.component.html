<h1 class="title">Supplier / Create</h1>

<form [formGroup]="supplierFormGroup" (ngSubmit)="onSubmit()">
  <div class="form-field">
    <label>Prefix</label>
    <select class="input" formControlName="prefix">
      <option value="PT.">PT.</option>
      <option value="CV.">CV.</option>
      <option value="UD.">UD.</option>
      <option value="Pribadi">Pribadi</option>
      <option value="Lainnya">Lainnya</option>
    </select>
  </div>

  <div class="form-field">
    <label>Name</label>
    <input
      class="input"
      type="text"
      formControlName="name"
      placeholder="Supplier name"
    />
  </div>

  <div class="form-field">
    <label>Address</label>
    <textarea
      class="input"
      formControlName="address"
      rows="3"
      placeholder="Supplier address"
      style="resize: none"
    ></textarea>
  </div>
  <div class="row">
    <div class="col-sm-6 col-12">
      <div class="form-field">
        <label>City</label>
        <input
          class="input"
          type="text"
          formControlName="city"
          placeholder="Supplier city"
        />
      </div>
    </div>
    <div class="col-sm-6 col-12">
      <div class="form-field">
        <label>Province</label>
        <input
          class="input"
          type="text"
          formControlName="province"
          placeholder="Supplier province"
        />
      </div>
    </div>
  </div>

  <div class="form-field">
    <label>NPWP</label>
    <input
      class="input"
      type="tel"
      formControlName="npwp"
      placeholder="NPWP Supplier"
      maxlength="16"
    />
  </div>

  <div class="form-field">
    <label>Phone</label>
    <input
      class="input"
      type="tel"
      formControlName="phone_number"
      placeholder="Supplier's phone number"
    />
  </div>

  <div class="form-field">
    <label>Email</label>
    <input
      class="input"
      type="email"
      formControlName="email"
      placeholder="Supplier's email"
    />
  </div>

  <mat-divider class="mb-3"></mat-divider>
  <h2 class="title">Search Helper</h2>

  <div class="form-field">
    <label>Items sold</label>
    <p>This will help us find the right supplier when searching.</p>

    <mat-chip-set aria-label="Items sold selection">
      <mat-chip
        *ngFor="let item of items"
        [removable]="true"
        (removed)="remove(item)"
      >
        {{ item }}
        <button matChipRemove aria-label="Remove item">
          <i class="bi bi-x"></i>
        </button>
      </mat-chip>
    </mat-chip-set>

    <input
      class="input mt-3"
      formControlName="soldItems"
      placeholder="Items sold"
    />
  </div>

  <div class="form-field mt-3">
    <label>Service areas</label>

    <mat-chip-set aria-label="Areas selection">
      <mat-chip
        *ngFor="let item of areas"
        [removable]="true"
        (removed)="removeArea(item)"
      >
        {{ item }}
        <button matChipRemove aria-label="Remove area">
          <i class="bi bi-x"></i>
        </button>
      </mat-chip>
    </mat-chip-set>

    <input
      class="input mt-3"
      formControlName="serviceAreas"
      placeholder="Service areas"
    />
  </div>

  <button
    class="btn mt-3"
    type="submit"
    [disabled]="
      isSubmitting ||
      supplierFormGroup.invalid ||
      items.length === 0 ||
      areas.length === 0
    "
  >
    Submit
  </button>
</form>
