<div class="title__wrapper mb-4">
  <h1 class="title">Supplier</h1>
</div>

<div class="position-absolute bottom-0 end-0 m-3">
  <button mat-fab color="primary" routerLink="/Supplier/Create">
    <mat-icon>add</mat-icon>
  </button>
</div>

<div class="search__wrapper">
  <mat-form-field appearance="outline" class="w-100">
    <input
      matInput
      type="text"
      class="input"
      placeholder="Search supplier"
      [formControl]="formControl"
    />
  </mat-form-field>
</div>
<div class="table-responsive">
  <table mat-table [dataSource]="suppliers">
    <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

    <!-- Position Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let element">
        {{ element.name }}
      </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef>Address</th>
      <td mat-cell *matCellDef="let element">
        {{ element.address }}, {{ element.city }}, {{ element.province }}
      </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Phone number</th>
      <td mat-cell *matCellDef="let element">{{ element.phone_number }}</td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let element">{{ element.email ?? "N/A" }}</td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let element">
        <span style="display: flex; align-items: center; gap: 4px">
          <button mat-icon-button (click)="onViewDetail(element.id)">
            <mat-icon>open_in_full</mat-icon>
          </button>
          <button
            mat-icon-button
            [routerLink]="['/Supplier/Update', element.id]"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="onConfirmDelete(element.id)">
            <mat-icon>close</mat-icon>
          </button>
        </span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell text-center" [attr.colspan]="displayedColumns.length">
        No data matching the filter.
      </td>
    </tr>
  </table>

  <mat-paginator
    [pageIndex]="page - 1"
    [length]="count"
    [pageSize]="10"
    (page)="changePage($event)"
    [pageSizeOptions]="[10, 25, 50]"
    [pageSize]="pageSize"
  ></mat-paginator>
</div>
