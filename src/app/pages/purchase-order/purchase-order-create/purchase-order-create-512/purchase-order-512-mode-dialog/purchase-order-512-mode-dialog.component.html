<div class="pmd">
  <div class="pmd-head" mat-dialog-title appDialogGeser>
    <span class="pmd-badge">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
        />
      </svg>
    </span>
    <div class="pmd-head__text">
      <h2 class="pmd-title">{{ "poForm.assetMaintenance" | translate }}</h2>
      <span class="pmd-sub">{{ "poForm.mauBeliBarangnyaAtauPesan" | translate }}</span>
    </div>
  </div>

  <mat-dialog-content class="pmd-content">
    <div class="pmd-grid">
      <button type="button" class="pmd-pick" (click)="pick('barang')">
        <span class="pmd-pick__ico">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m21 8-9-5-9 5 9 5 9-5z" />
            <path d="M3 8v8l9 5 9-5V8M12 13v8" />
          </svg>
        </span>
        <span class="pmd-pick__name">{{ "poForm.beliBarang" | translate }}</span>
        <span class="pmd-pick__desc"
          >{{ "poForm.sparepartMaterialPerawatanDiambilD" | translate }}</span
        >
      </button>

      <button type="button" class="pmd-pick" (click)="pick('jasa')">
        <span class="pmd-pick__ico">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
            />
          </svg>
        </span>
        <span class="pmd-pick__name">{{ "poForm.pesanJasa" | translate }}</span>
        <span class="pmd-pick__desc"
          >{{ "poForm.jasaPerbaikanServisUraianPekerjaan" | translate }}</span
        >
      </button>
    </div>
  </mat-dialog-content>
</div>
