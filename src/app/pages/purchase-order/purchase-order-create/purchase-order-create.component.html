<div class="poc">
  <div class="poc-head">
    <h1 class="poc-title">Buat Purchase Order</h1>
    <p class="poc-sub">Pilih jenis pembelian yang mau dibuat</p>
  </div>

  <!-- Project expenses -->
  <div class="poc-section">
    <div class="poc-section__head">
      <span class="poc-section__title">Project expenses</span>
      <span class="poc-section__count">{{ projectTiles.length }}</span>
    </div>
    <div class="poc-grid">
      @for (tile of projectTiles; track tile) {
        <button
          type="button"
          class="poc-tile"
          (click)="onCreatePurchaseOrder(tile.type)"
        >
          <span class="poc-tile__badge">{{ tile.type }}</span>
          <span class="poc-tile__body">
            <span class="poc-tile__title">{{ tile.title }}</span>
            <span class="poc-tile__desc">{{ tile.description }}</span>
          </span>
          <span class="poc-tile__arrow">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </span>
        </button>
      }
    </div>
  </div>

  <!-- Office expenses -->
  <div class="poc-section">
    <div class="poc-section__head">
      <span class="poc-section__title">Office expenses</span>
      <span class="poc-section__count">{{ officeTiles.length }}</span>
    </div>
    <div class="poc-grid">
      @for (tile of officeTiles; track tile) {
        <a class="poc-tile" [routerLink]="tile.link">
          <span class="poc-tile__badge poc-tile__badge--num">{{
            tile.type
          }}</span>
          <span class="poc-tile__body">
            <span class="poc-tile__title">{{ tile.title }}</span>
            <span class="poc-tile__desc">{{ tile.description }}</span>
          </span>
          <span class="poc-tile__arrow">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </span>
        </a>
      }
    </div>
  </div>
</div>
