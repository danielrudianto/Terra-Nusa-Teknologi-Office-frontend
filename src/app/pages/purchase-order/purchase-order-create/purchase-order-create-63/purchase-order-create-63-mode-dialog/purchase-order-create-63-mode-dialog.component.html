<div class="pmd">
  <div class="pmd-head" mat-dialog-title>
    <span class="pmd-badge">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m3 11 18-5v12L3 14v-3z" />
        <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6" />
      </svg>
    </span>
    <div class="pmd-head__text">
      <h2 class="pmd-title">{{ data?.typeLabel || ('hardcoded.marketing' | translate) }}</h2>
      <span class="pmd-sub"
        >{{ "po63.poIniIsinyaBarangAtau" | translate }}</span
      >
    </div>
  </div>

  <mat-dialog-content class="pmd-content">
    <div class="pmd-grid">
      <button type="button" class="pmd-pick" (click)="pick('barang')">
        <span class="pmd-pick__ico">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m21 8-9-5-9 5 9 5 9-5z" />
            <path d="M3 8v8l9 5 9-5V8M12 13v8" />
          </svg>
        </span>
        <span class="pmd-pick__name">{{ "po512.barang" | translate }}</span>
        <span class="pmd-pick__desc"
          >{{ "po63.merchandiseSepertiMugKaosPayung" | translate }}</span
        >
      </button>

      <button type="button" class="pmd-pick" (click)="pick('jasa')">
        <span class="pmd-pick__ico">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m23 7-7 5 7 5V7z" />
            <rect x="1" y="5" width="15" height="14" rx="2" />
          </svg>
        </span>
        <span class="pmd-pick__name">{{ "po512.jasa" | translate }}</span>
        <span class="pmd-pick__desc"
          >{{ "po63.shootingVideoFotoProdukDesain" | translate }}</span
        >
      </button>
    </div>
  </mat-dialog-content>
</div>
