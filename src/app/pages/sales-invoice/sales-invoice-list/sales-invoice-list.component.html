<div class="title__wrapper mb-4">
  <h1 class="title">Sales Invoice</h1>
</div>

<div class="position-absolute bottom-0 end-0 m-3">
  <button mat-fab color="primary" routerLink="/Sales-invoice/Create">
    <mat-icon>add</mat-icon>
  </button>
</div>

<div class="table-responsive">
  <table mat-table [dataSource]="salesInvoices">
    <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>
        <div class="d-flex d-align-items-center">
          <span>Date</span>
        </div>
      </th>
      <td mat-cell *matCellDef="let invoice">
        {{ invoice.date | date : "dd MMM yyyy" }}
      </td>
    </ng-container>

    <ng-container matColumnDef="invoiceNumber">
      <th mat-header-cell *matHeaderCellDef>
        <div class="d-flex d-align-items-center">
          <span>Invoice Number</span>
        </div>
      </th>
      <td mat-cell *matCellDef="let invoice">
        {{ invoice.invoiceNumber }}
      </td>
    </ng-container>

    <ng-container matColumnDef="customer">
      <th mat-header-cell *matHeaderCellDef>
        <div class="d-flex d-align-items-center">
          <span>Customer</span>
        </div>
      </th>
      <td mat-cell *matCellDef="let invoice">
        {{ invoice.customer.name }}
      </td>
    </ng-container>
  </table>
</div>
