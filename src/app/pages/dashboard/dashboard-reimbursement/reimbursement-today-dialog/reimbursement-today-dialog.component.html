<div class="rtd">
  <div class="rtd__head" mat-dialog-title appDialogGeser>
    <span class="rtd__badge">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
          <path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 2V2l-1 2-3-2-3 2-3-2-3 2-3-2z" />
          <path d="M8 8h8M8 12h8M8 16h5" />
      </svg>
    </span>
    <div class="rtd__head-text">
      <h2 class="rtd__title">
        {{ "dashboardReimbursement.dialogTitle" | translate }}
      </h2>
      <span class="rtd__sub"
        >{{ items.length }}
        {{ "dashboardReimbursement.pendingCount" | translate }}</span
      >
    </div>
    <button class="rtd__close" (click)="close()" [attr.aria-label]="'dashboard.close' | translate">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="rtd__total">
    <span>{{ "dashboardReimbursement.total" | translate }}</span>
    <strong>{{ formatIDR(total) }}</strong>
  </div>

  <div class="rtd__body">
    <div class="rtd__empty" *ngIf="items.length === 0">
      {{ "dashboardReimbursement.empty" | translate }}
    </div>

    <button
      class="rtd__row"
      *ngFor="let it of items"
      (click)="view(it.id)"
      type="button"
    >
      <span class="rtd__avatar">{{ initial(it.name) }}</span>
      <div class="rtd__info">
        <span class="rtd__row-title">{{ it.name }}</span>
        <span class="rtd__row-sub">{{ it.projectName }}</span>
      </div>
      <span class="rtd__amount">{{ formatIDR(it.amount) }}</span>
    </button>
  </div>
</div>
