<div class="eoc">
  <div class="eoc-head" mat-dialog-title>
    <span class="eoc-badge">
      <mat-icon>person_add</mat-icon>
    </span>
    <div class="eoc-head__text">
      <h2 class="eoc-title">Tambah lawan transaksi</h2>
      <span class="eoc-sub">Data penerima/pembayar untuk pencatatan beban</span>
    </div>
  </div>

  <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="eoc-content">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nama</mat-label>
        <input
          matInput
          formControlName="name"
          placeholder="Masukkan nama lawan transaksi"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Tipe</mat-label>
        <mat-select formControlName="type" placeholder="Pilih tipe">
          <mat-option [value]="'individual'">Individu</mat-option>
          <mat-option [value]="'company'">Perusahaan</mat-option>
          <mat-option [value]="'government'">Pemerintah</mat-option>
          <mat-option [value]="'other'">Lainnya</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Deskripsi</mat-label>
        <textarea
          matInput
          formControlName="description"
          placeholder="Masukkan deskripsi"
          rows="3"
          style="resize: none"
        ></textarea>
      </mat-form-field>

      <div class="eoc-row">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Nomor pembayaran</mat-label>
          <input
            matInput
            type="text"
            formControlName="paymentNumber"
            placeholder="No. rekening / pembayaran"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>NPWP</mat-label>
          <input
            matInput
            type="text"
            formControlName="npwp"
            placeholder="Opsional"
          />
        </mat-form-field>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="eoc-actions">
      <button
        type="button"
        mat-stroked-button
        mat-dialog-close
        class="eoc-btn eoc-btn--ghost"
      >
        Batal
      </button>
      <button
        type="submit"
        mat-flat-button
        [disabled]="isSubmitting || !formGroup.valid"
        class="eoc-btn eoc-btn--primary"
      >
        <mat-icon *ngIf="!isSubmitting">check</mat-icon>
        {{ isSubmitting ? "Menyimpan..." : "Simpan" }}
      </button>
    </mat-dialog-actions>
  </form>
</div>
