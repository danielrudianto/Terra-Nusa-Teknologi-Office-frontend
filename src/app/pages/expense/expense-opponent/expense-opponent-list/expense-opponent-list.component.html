<div class="eol">
  <app-header-title
    [title]="'Expense Opponent'"
    [description]="'Daftar lawan transaksi biaya'"
    [actionButtonLabel]="'Tambah opponent'"
    (onActionButtonClicked)="createOpponent()"
  ></app-header-title>

  <!-- toolbar -->
  <div class="eol-toolbar">
    <mat-form-field appearance="outline" class="eol-search">
      <mat-icon matPrefix>search</mat-icon>
      <mat-label>Search</mat-label>
      <input
        matInput
        type="text"
        placeholder="Cari nama, tipe, atau NPWP"
        [formControl]="formControl"
      />
    </mat-form-field>
  </div>

  <!-- card -->
  <div class="eol-card">
    <div class="table-responsive">
      <table mat-table [dataSource]="suppliers">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let element">
            <span class="eol-name">{{ element.name }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let element">
            <span class="eol-muted">{{ element.description || "—" }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let element">
            <span class="eol-chip">{{ element.type || "—" }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="npwp">
          <th mat-header-cell *matHeaderCellDef>NPWP</th>
          <td mat-cell *matCellDef="let element">
            <span [class.eol-muted]="element.npwp == null">{{
              element.npwp == null ? "N/A" : element.npwp
            }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="paymentNumber">
          <th mat-header-cell *matHeaderCellDef>Payment number</th>
          <td mat-cell *matCellDef="let element">
            <div class="eol-pay">
              <span>{{ element.paymentNumber || "—" }}</span>
              <button
                *ngIf="element.paymentNumber"
                mat-icon-button
                class="eol-copy"
                (click)="copyPaymentNumber(element.paymentNumber)"
                aria-label="Salin payment number"
              >
                <mat-icon>content_copy</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef aria-label="Actions"></th>
          <td
            mat-cell
            *matCellDef="let element"
            (click)="$event.stopPropagation()"
          >
            <button
              mat-icon-button
              [matMenuTriggerFor]="menu"
              aria-label="Row actions"
            >
              <mat-icon>more_horiz</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="onViewDetail(element.id)">
                <mat-icon>edit</mat-icon><span>Edit opponent</span>
              </button>
              <button mat-menu-item (click)="onViewDetail(element.id)">
                <mat-icon>delete</mat-icon><span>Hapus opponent</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr class="eol-norow" *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length">
            <div class="eol-empty">
              <mat-icon>inbox</mat-icon>
              <span>Tidak ada data yang cocok</span>
            </div>
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      [pageIndex]="page - 1"
      [length]="count"
      [pageSize]="10"
      [pageSizeOptions]="[10, 25, 50]"
      (page)="changePage($event)"
    ></mat-paginator>
  </div>
</div>
