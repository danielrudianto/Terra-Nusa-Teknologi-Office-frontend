<div class="title__wrapper mb-4">
  <h1 class="title"><a routerLink="/Expense">Expense</a> / Opponent</h1>
</div>

<div class="position-absolute bottom-0 end-0 m-3">
  <button mat-fab color="primary" routerLink="/Expense/Opponent/Create">
    <mat-icon>add</mat-icon>
  </button>
</div>

<div class="search__wrapper">
  <mat-form-field appearance="outline" class="w-100">
    <input
      matInput
      type="text"
      class="input"
      placeholder="Search expense opponent"
      [formControl]="formControl"
    />
  </mat-form-field>
</div>
<table mat-table [dataSource]="suppliers">
  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- Position Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let element">
      {{ element.name }}
    </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Description</th>
    <td mat-cell *matCellDef="let element">
      {{ element.description }}
    </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>Type</th>
    <td mat-cell *matCellDef="let element">{{ element.type }}</td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="npwp">
    <th mat-header-cell *matHeaderCellDef>NPWP</th>
    <td mat-cell *matCellDef="let element">
      {{ element.npwp == null ? "N/A" : element.npwp }}
    </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="paymentNumber">
    <th mat-header-cell *matHeaderCellDef>Payment number</th>
    <td mat-cell *matCellDef="let element">
      <div class="d-flex align-items-center">
        {{ element.paymentNumber }}
        <button
          mat-icon-button
          (click)="copyPaymentNumber(element.paymentNumber)"
        >
          <mat-icon>content_copy</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>

  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>Action</th>
    <td mat-cell *matCellDef="let element">
      <span style="display: flex; align-items: center; gap: 4px">
        <button
          mat-icon-button
          (click)="onViewDetail(element.id)"
          aria-label="Example icon button with a vertical three dot icon"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          (click)="onViewDetail(element.id)"
          aria-label="Example icon button with a vertical three dot icon"
        >
          <mat-icon>close</mat-icon>
        </button>
      </span>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell text-center" [attr.colspan]="displayedColumns.length">
      No data matching the filter.
    </td>
  </tr>
</table>

<mat-paginator
  [pageIndex]="page - 1"
  [length]="count"
  [pageSize]="10"
  [pageSizeOptions]="[10, 25, 50]"
  (page)="changePage($event)"
></mat-paginator>
