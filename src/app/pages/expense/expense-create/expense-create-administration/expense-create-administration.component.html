<div class="eca">
  <div class="eca-head" mat-dialog-title appDialogGeser>
    <span class="eca-head__icon"><mat-icon>account_balance</mat-icon></span>
    <div class="eca-head__text">
      <h2 class="eca-title">{{ "expenseAdmin.title" | translate }}</h2>
      <span class="eca-sub">{{ "expenseAdmin.subtitle" | translate }}</span>
    </div>
  </div>

  <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="eca-content">
      <mat-form-field appearance="outline" class="eca-full">
        <mat-label>{{ "expenseAdmin.date" | translate }}</mat-label>
        <input matInput formControlName="date" [matDatepicker]="picker" />
        <mat-datepicker-toggle matPrefix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="eca-full">
        <mat-label>{{ "expenseAdmin.amount" | translate }}</mat-label>
        <input
          matInput
          formControlName="dpp"
          prefix="Rp. "
          thousandSeparator=" "
          mask="separator.2"
        />
      </mat-form-field>

      <app-bank-account-selector
        formControlName="bankAccountID"
        [label]="'expenseAdmin.bankOrigin' | translate"
        class="eca-full"
      />
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="eca-foot">
      <button
        type="button"
        class="eca-cancel"
        mat-dialog-close
        [disabled]="isSubmitting"
      >
        {{ "expenseAdmin.cancel" | translate }}
      </button>
      <button
        type="submit"
        class="eca-submit"
        cdkFocusInitial
        [disabled]="formGroup.invalid || isSubmitting"
      >
        {{
          isSubmitting
            ? ("expenseAdmin.submitting" | translate)
            : ("expenseAdmin.submit" | translate)
        }}
      </button>
    </mat-dialog-actions>
  </form>
</div>
