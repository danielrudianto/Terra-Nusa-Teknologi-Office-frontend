<!-- file-drop.component.html -->
<div class="dropzone-container">
  <div class="dropzone" [class.dragover]="isDragging" *ngIf="show">
    <input
      type="file"
      [accept]="allowedList"
      [multiple]="allowMultipleFiles"
      (drop)="onFilePlaced($event)"
      (change)="onFileSelected($event)"
      #fileDropRef
    />
    <div class="dz-inner">
      <span class="dz-icon">
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <path d="M17 8l-5-5-5 5" />
          <path d="M12 3v12" />
        </svg>
      </span>
      <p class="dz-title">{{ "pdf.dragDropPdfDiSini" | translate }}</p>
      <p class="dz-sub">atau <b>browse</b> dari komputer</p>
      <span class="dz-hint">{{ "pdf.mendukungBanyakFilePdfSekaligus" | translate }}</span>
    </div>
  </div>

  <!-- Drag overlay -->
  <div class="drag-overlay" [class.visible]="isDragging">
    <div class="overlay-content">
      <svg
        width="34"
        height="34"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <path d="M17 8l-5-5-5 5" />
        <path d="M12 3v12" />
      </svg>
      <h3>{{ "pdf.lepasUntukUpload" | translate }}</h3>
      <p>{{ "pdf.filePdfMuAkanLangsung" | translate }}</p>
    </div>
  </div>
</div>
