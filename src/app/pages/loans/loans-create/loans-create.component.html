<h2 mat-dialog-title>Create new loan</h2>

<form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Date</mat-label>
      <input matInput formControlName="date" [matDatepicker]="picker" />
      <mat-datepicker-toggle matPrefix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <!-- CreditorName -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Creditor Name</mat-label>
      <input matInput formControlName="creditorName" />
    </mat-form-field>

    <!-- CreditorAddress -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Creditor Address</mat-label>
      <input matInput formControlName="creditorAddress" />
    </mat-form-field>

    <!-- CreditorAddress -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Creditor NPWP</mat-label>
      <input matInput formControlName="creditorNPWP" />
    </mat-form-field>

    <!-- Description -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description" />
    </mat-form-field>
  </mat-dialog-content>
</form>
