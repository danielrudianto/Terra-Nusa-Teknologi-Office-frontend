<h1 mat-dialog-title class="cpc-title">
  {{ "calendarPayment.confirmTitle" | translate }}
</h1>

<mat-dialog-content>
  <p class="cpc-prompt">
    {{
      "calendarPayment.confirmPrompt"
        | translate: { count: data.payments.length }
    }}
  </p>

  <div class="cpc-warning">
    <mat-icon>warning</mat-icon>
    <p>
      <strong>{{ "calendarPayment.attention" | translate }}</strong>
      {{ "calendarPayment.warningConfirm" | translate }}
    </p>
  </div>

  <mat-checkbox
    [formControl]="agreeControl"
    class="cpc-agree"
    color="primary"
    >{{ "calendarPayment.agree" | translate }}</mat-checkbox
  >
</mat-dialog-content>

<mat-dialog-actions align="end" class="cpc-foot">
  <button type="button" class="cpc-cancel" mat-dialog-close>
    {{ "calendarPayment.cancel" | translate }}
  </button>
  <button
    type="button"
    class="cpc-confirm"
    (click)="onConfirm()"
    [disabled]="agreeControl.value === false"
  >
    {{ "calendarPayment.confirm" | translate }}
  </button>
</mat-dialog-actions>
