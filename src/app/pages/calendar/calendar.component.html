<div
  class="side-dialog-backdrop"
  *ngIf="sideDialogActive"
  (click)="closeSideDialog()"
></div>
<div class="side-dialog" [class.side-dialog--active]="sideDialogActive">
  <!-- Your dialog content here -->
  <ng-container #sideDialogContent>
    <app-calendar-day-view
      [date]="selectedDay"
      [month]="month"
      [year]="year"
      [bankAccountID]="bankAccounts"
      (onClose)="closeSideDialog()"
    ></app-calendar-day-view>
  </ng-container>
</div>
<div class="calendar__container">
  <div class="top">
    <app-calendar-month-selector
      [month]="month"
      [year]="year"
      (onMonthYearSelected)="onMonthChanged($event)"
    ></app-calendar-month-selector>
    <app-calendar-account-selector
      (onBankAccountChanges)="onBankAccountChanges($event)"
    />
  </div>
  <app-calendar-table
    [month]="month"
    [year]="year"
    [bankAccounts]="bankAccounts"
    [selectedDay]="selectedDay"
    (onCalendarBoxClicked)="onCalendarBoxClicked($event)"
  ></app-calendar-table>
</div>
