<div class="calendar__container">
  <div class="cal-head">
    <div class="cal-head__title">
      <h1 class="cal-title">{{ "calendar.title" | translate }}</h1>
      <p class="cal-sub">{{ "calendar.subtitle" | translate }}</p>
    </div>

    <div class="cal-head__controls">
      <app-calendar-month-selector
        [month]="month"
        [year]="year"
        (onMonthYearSelected)="onMonthChanged($event)"
      ></app-calendar-month-selector>

      <app-calendar-account-selector
        (onBankAccountChanges)="onBankAccountChanges($event)"
      />

      <mat-button-toggle-group
        [formControl]="viewMode"
        class="cal-viewmode"
        hideSingleSelectionIndicator
      >
        <mat-button-toggle value="expense">{{
          "calendar.expense" | translate
        }}</mat-button-toggle>
        <mat-button-toggle value="income">{{
          "calendar.income" | translate
        }}</mat-button-toggle>
        <mat-button-toggle value="balance">{{
          "calendar.balance" | translate
        }}</mat-button-toggle>
      </mat-button-toggle-group>

      <!--
        Segarkan: isi kalender berubah karena tindakan ORANG LAIN — pembayaran
        disetujui, rencana ditandai terpakai. Tanpa tombol ini satu-satunya
        cara adalah memuat ulang halaman, dan itu mengembalikan bulan serta
        saringan rekening ke keadaan awal.

        Memakai tombol BERSAMA yang sudah dipakai dua puluh lima daftar lain,
        bukan tombol sendiri: bentuk, kata, dan putaran ikonnya jadi sama di
        seluruh aplikasi, dan perbaikan pada tombolnya sampai ke sini juga.
      -->
      <app-refresh-button (muatUlang)="muatUlang()" />
    </div>
  </div>

  <app-calendar-table
    [month]="month"
    [year]="year"
    [bankAccounts]="bankAccounts"
    (onCalendarBoxClicked)="onCalendarBoxClicked($event)"
    [viewMode]="viewMode.value"
    [penyegar]="penyegar"
  ></app-calendar-table>
</div>
