<h2 mat-dialog-title>Select bank account</h2>
<mat-dialog-content>
  <mat-selection-list>
    <mat-list-option
      *ngFor="let account of this.bankAccounts"
      [checkboxPosition]="'before'"
      [selected]="account.selected"
      (selectedChange)="onSelectionChanged(account.id, $event)"
    >
      {{ account.bankAccountNumber }} -- {{ account.bankAccountName }}
    </mat-list-option>
  </mat-selection-list>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button color="primary" (click)="onDialogClosed()">Select</button>
  <button mat-button (click)="onClose()">Cancel</button>
</mat-dialog-actions>
