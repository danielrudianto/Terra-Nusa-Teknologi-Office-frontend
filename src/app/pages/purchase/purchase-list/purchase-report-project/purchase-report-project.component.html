<div class="prp">
  <div class="prp-head" mat-dialog-title>
    <span class="prp-badge">
      <mat-icon>assessment</mat-icon>
    </span>
    <div class="prp-head__text">
      <h2 class="prp-title">{{ "purchaseReport.projectTitle" | translate }}</h2>
      <span class="prp-sub">{{
        "purchaseReport.projectSubtitle" | translate
      }}</span>
    </div>
  </div>

  <form [formGroup]="formGroup">
    <mat-dialog-content class="prp-content">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>{{ "purchaseReport.projectCode" | translate }}</mat-label>
        <input
          matInput
          [placeholder]="'purchaseReport.projectCodePlaceholder' | translate"
          formControlName="projectName"
          (keyup)="toUpperCase()"
          maxlength="5"
          autocomplete="off"
        />
        <mat-hint>4–5 karakter, huruf kapital / angka</mat-hint>
      </mat-form-field>

      <div class="prp-note">
        <mat-icon>info</mat-icon>
        <span
          >Laporan berisi rekap pembelian & reimbursement per tipe,
          dikelompokkan mingguan.</span
        >
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="prp-actions">
      <button
        type="button"
        mat-stroked-button
        [mat-dialog-close]="false"
        class="prp-btn prp-btn--ghost"
      >
        Batal
      </button>
      <button
        type="submit"
        mat-flat-button
        [disabled]="!formGroup.valid || isLoading"
        (click)="onSubmit()"
        class="prp-btn prp-btn--primary"
      >
        <mat-icon *ngIf="!isLoading">picture_as_pdf</mat-icon>
        {{ isLoading ? "Memproses..." : "Buat laporan" }}
      </button>
    </mat-dialog-actions>
  </form>
</div>
