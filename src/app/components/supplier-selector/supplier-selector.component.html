<div class="ss">
  <div mat-dialog-title class="ss-head">
    <div class="ss-head__text">
      <h2 class="ss-title">Pilih Supplier</h2>
      <span class="ss-sub">Cari berdasarkan nama atau alamat</span>
    </div>
    <button type="button" class="ss-x" mat-dialog-close aria-label="Tutup">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>

  <mat-dialog-content class="ss-content">
    <mat-form-field appearance="outline" class="ss-search">
      <svg
        matPrefix
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        class="ss-search__icon"
      >
        <circle cx="11" cy="11" r="7" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <mat-label>Cari supplier</mat-label>
      <input matInput [formControl]="searchBar" placeholder="Nama supplier" />
    </mat-form-field>

    <div class="ss-loading" *ngIf="isLoading">
      <mat-spinner diameter="34"></mat-spinner>
    </div>

    <div class="ss-empty" *ngIf="!isLoading && suppliers.length === 0">
      <svg
        width="30"
        height="30"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M22 12h-6l-2 3h-4l-2-3H2" />
        <path
          d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"
        />
      </svg>
      <span>Supplier tidak ditemukan</span>
    </div>

    <div class="ss-list" *ngIf="!isLoading && suppliers.length > 0">
      <button
        type="button"
        class="ss-row"
        [class.ss-row--blacklist]="supplier.isBlacklist"
        *ngFor="let supplier of suppliers"
        (click)="selectSupplier(supplier)"
      >
        <span class="ss-avatar">{{ (supplier.name || "?").charAt(0) }}</span>
        <span class="ss-info">
          <span class="ss-name">
            {{ supplier.name
            }}<span class="ss-prefix" *ngIf="supplier.prefix"
              >, {{ supplier.prefix }}</span
            >
            <span class="ss-badge" *ngIf="supplier.isBlacklist">Blacklist</span>
          </span>
          <span class="ss-addr">{{ supplier.address || "—" }}</span>
          <span
            class="ss-blacklist-reason"
            *ngIf="supplier.isBlacklist && supplier.blacklistReason"
          >
            Alasan: {{ supplier.blacklistReason }}
          </span>
        </span>
        <svg
          class="ss-chevron"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="ss-actions">
    <button mat-button mat-dialog-close class="ss-close">Tutup</button>
  </mat-dialog-actions>
</div>
