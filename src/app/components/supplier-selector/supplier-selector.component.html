<div class="ss">
  <!--
    Kepala dialog mengikuti bentuk yang sudah mapan di aplikasi ini —
    acuannya `bank-create`: pita berwarna lembut, lencana 42px berisi SVG
    sebaris, judul dengan anak judul di sebelahnya.

    Sebelumnya judulnya berdiri sendiri di atas latar polos, tanpa lencana
    dan tanpa garis pemisah. Sah dan bersih, tetapi terlihat seperti dialog
    dari aplikasi yang berbeda — dan pemilih ini dibuka DARI dialog lain
    yang punya pitanya, sehingga bedanya terlihat berdampingan.
  -->
  <div mat-dialog-title class="ss-head" appDialogGeser>
    <span class="ss-lencana">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M10 17h4V5H2v12h3M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h1" />
        <circle cx="7.5" cy="17.5" r="2.5" />
        <circle cx="17.5" cy="17.5" r="2.5" />
      </svg>
    </span>
    <div class="ss-head__text">
      <h2 class="ss-title">{{ "selector.chooseSupplier" | translate }}</h2>
      <span class="ss-sub">{{
        "selector.searchByNameAddress" | translate
      }}</span>
    </div>
    <button type="button" class="ss-x" mat-dialog-close [attr.aria-label]="'tax.tutup' | translate">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>

  <mat-dialog-content class="ss-content">
    <!--
      Tanpa `matPrefix`.

      Pada `appearance="outline"`, label mengambang diposisikan di atas isi
      PERTAMA kotaknya — dan dengan prefiks, isi pertama itu ikonnya. Yang
      terlihat: "Cari supplier" duduk di pojok kiri garis tepi, terlepas
      dari tulisan yang diketik di sebelah kanan ikon, seolah labelnya salah
      taruh.

      Dua pemilih sebelahnya (`master-item-selector`, `equipment-selector`)
      tidak memakai prefiks sama sekali. Ikon kaca pembesar itu hiasan —
      label dan placeholder-nya sudah menyebutkan gunanya.
    -->
    <mat-form-field appearance="outline" class="ss-search">
      <mat-label>{{ "selector.searchSupplier" | translate }}</mat-label>
      <input
        autocomplete="off"
            type="search"
        matInput
        cdkFocusInitial
        [formControl]="searchBar"
        [placeholder]="'supplier.namaSupplier' | translate"
      />
    </mat-form-field>

    <div class="ss-loading" *ngIf="isLoading">
      <mat-spinner diameter="34"></mat-spinner>
    </div>

    <div class="ss-empty" *ngIf="!isLoading && suppliers.length === 0">
      <svg
        width="30"
        height="30"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M22 12h-6l-2 3h-4l-2-3H2" />
        <path
          d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"
        />
      </svg>
      <span>{{ "selector.supplierNotFound" | translate }}</span>
    </div>

    <div class="ss-list" *ngIf="!isLoading && suppliers.length > 0">
      <button
        type="button"
        class="ss-row"
        [class.ss-row--blacklist]="supplier.isBlacklist"
        *ngFor="let supplier of suppliers"
        (click)="selectSupplier(supplier)"
      >
        <span class="ss-avatar" *ngIf="!supplier.isBlacklist">{{
          (supplier.name || "?").charAt(0)
        }}</span>
        <span class="ss-avatar ss-avatar--danger" *ngIf="supplier.isBlacklist">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
            />
            <path d="M12 9v4M12 17h.01" />
          </svg>
        </span>
        <!--
          SATU nama, bukan nama + prefiks ditempel di belakangnya.

          Sebagian besar baris pemasok menyimpan badan usahanya DI DALAM
          namanya (", CV." di ujung) DAN pada kolom `prefix`. Menempelkan
          prefiks di belakang nama karena itu menghasilkan "Mega Baja
          Harapan Indah, CV., CV." — dan bukan pada satu-dua baris, melainkan
          pada hampir semuanya.

          `namaTampil` memakai `vendorDisplayName`, penolong yang sama yang
          dipakai seluruh dokumen tercetak: ekor yang terbawa dibuang,
          prefiksnya ditulis di DEPAN, dan penulisan ganda ditahan. Hasilnya
          pemilih ini menyebut vendor dengan nama yang sama persis seperti
          yang nanti tercetak di surat perintah kerjanya.
        -->
        <span class="ss-info">
          <span class="ss-name">
            {{ namaTampil(supplier) }}
            <span class="ss-badge" *ngIf="supplier.isBlacklist">{{
              "selector.blacklist" | translate
            }}</span>
          </span>
          <span class="ss-addr">{{ supplier.address || "—" }}</span>
          <span
            class="ss-blacklist-reason"
            *ngIf="supplier.isBlacklist && supplier.blacklistReason"
          >
            Alasan: {{ supplier.blacklistReason }}
          </span>
        </span>
        <svg
          class="ss-chevron"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="ss-actions">
    <button mat-button mat-dialog-close class="ss-close">
      {{ "common.close" | translate }}
    </button>
  </mat-dialog-actions>
</div>
