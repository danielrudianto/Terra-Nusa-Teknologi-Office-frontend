<mat-dialog-content>
  <mat-calendar
    style="width: 300px"
    [selected]="selectedDate"
    [minDate]="data.minimumDate"
    [maxDate]="data.maximumDate"
    (selectedChange)="onSelectedChanged($event)"
  ></mat-calendar>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    matButton="outlined"
    color="primary"
    style="letter-spacing: 0"
    (click)="onSubmit()"
    [disabled]="isSubmitting"
  >
    Submit
  </button>
</mat-dialog-actions>
