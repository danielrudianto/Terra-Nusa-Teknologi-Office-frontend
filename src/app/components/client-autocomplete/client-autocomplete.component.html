<mat-form-field appearance="outline" class="cla">
  <mat-label>{{ label | translate }}</mat-label>

  <input
    matInput
    [formControl]="teks"
    [matAutocomplete]="auto"
    [required]="required"
    (input)="onKetik($any($event.target).value)"
    (focus)="onFokus()"
    [placeholder]="'client.selectorPlaceholder' | translate"
  />

  <!--
    Penanda terpilih.

    Yang membedakan "sudah memilih" dari "baru mengetik namanya" hanya ini;
    tanpa penanda, keduanya terlihat sama padahal yang kedua belum menyimpan
    apa pun.
  -->
  <!--
    Selalu tergambar; yang berubah hanya tampak-tidaknya.

    `matSuffix` ditemukan `mat-form-field` lewat proyeksi konten, dan
    selektornya dinilai atas susunan templat STATIS. Di dalam `@if`,
    elemennya berada di tampilan tersemat yang tidak terjangkau — sehingga
    ikonnya jatuh ke dalam kotak isian alih-alih menempel di kanannya.
  -->
  <mat-icon
    matSuffix
    class="cla-ok"
    [class.cla-ok--sembunyi]="!terpilih"
    >check_circle</mat-icon
  >

  <mat-autocomplete #auto="matAutocomplete" [displayWith]="tampilan">
    @for (k of saran; track k.id) {
      <mat-option [value]="k" (onSelectionChange)="pilih(k, $event.isUserInput)">
        <span class="cla-nama">{{ tampilan(k) }}</span>
        @if (k.city) {
          <span class="cla-kota">{{ k.city }}</span>
        }
      </mat-option>
    }

    @if (!isLoading && !saran.length) {
      <mat-option [disabled]="true">
        {{ "client.noMatch" | translate }}
      </mat-option>
    }
  </mat-autocomplete>

</mat-form-field>

<!--
  Banner, bukan hint.

  Hint tertutup daftar saran begitu autocomplete-nya terbuka — persis saat
  keterangan ini paling diperlukan, yaitu ketika orang sedang mengetik dan
  belum menyadari bahwa mengetik saja tidak menyimpan kliennya.
-->
<div class="cla-banner">
  <mat-icon>info</mat-icon>
  <span>{{ "client.selectorHint" | translate }}</span>
</div>
