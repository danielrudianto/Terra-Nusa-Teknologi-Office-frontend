<button
  class="side-navigation-button__wrapper"
  role="button"
  [routerLink]="routerLink"
  [routerLinkActive]="'active'"
  [routerLinkActiveOptions]="routerLink === '/' ? {
    exact: true,
  } : {exact: false}"
>
  <img [src]="iconSource" width="18" height="18" />
  <span> {{ label }}</span>
</button>
