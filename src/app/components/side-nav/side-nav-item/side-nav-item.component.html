<!--
  `punya-pin` memesan jalur kanan HANYA pada baris yang benar-benar punya pin.

  Kelompok bawah (Pengaturan, Keluar) memakai `showPin=false`; sebelumnya jalur
  itu tetap dipesan di sana dan 22px hilang tanpa ada yang menempatinya.
-->
<div class="snav-row" [class.punya-pin]="showPin">
  <button
    class="side-navigation-button__wrapper"
    type="button"
    [routerLink]="routerLink || null"
    [routerLinkActive]="'active'"
    [routerLinkActiveOptions]="
      routerLink === '/' || hasChildRoutes ? { exact: true } : { exact: false }
    "
    (click)="onActivate()"
  >
    <!-- Ikon dirender sebagai mask, bukan <img>, supaya warnanya mengikuti
         currentColor (warna aksen) alih-alih dikunci lewat filter hue. -->
    <span
      class="snav-ico"
      [ngStyle]="{ '--snav-ico': 'url(' + iconSource + ')' }"
    ></span>
    <span class="snav-label">{{ label | translate }}</span>

    <!--
      Lencana diletakkan DI DALAM tombolnya, sesudah labelnya.

      Di luar tombol ia tidak ikut berpindah saat menunya menyempit, dan pada
      menu terlipat ia menggantung di ruang kosong. Di dalam, ia mengikuti
      labelnya ke mana pun.
    -->
    <span
      *ngIf="badge !== null && badge > 0"
      class="snav-badge"
      [attr.aria-label]="
        ('sidenav.menungguAnda' | translate) + ': ' + badgeText
      "
      >{{ badgeText }}</span
    >
  </button>

  <button
    *ngIf="showPin"
    class="snav-pin"
    [class.on]="pinned"
    type="button"
    (click)="onPin($event)"
    [attr.aria-label]="pinned ? 'Lepas pin ' + label : 'Pin ' + label"
  >
    <svg
      width="13"
      height="13"
      viewBox="0 0 24 24"
      [attr.fill]="pinned ? 'currentColor' : 'none'"
      stroke="currentColor"
      stroke-width="1.9"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="12" y1="17" x2="12" y2="22" />
      <path
        d="M9 9V3.8a.8.8 0 0 1 .8-.8h4.4a.8.8 0 0 1 .8.8V9l2.4 2.6a1 1 0 0 1 .26.68V13a1 1 0 0 1-1 1H7.34a1 1 0 0 1-1-1v-.72a1 1 0 0 1 .26-.68z"
      />
    </svg>
  </button>
</div>
