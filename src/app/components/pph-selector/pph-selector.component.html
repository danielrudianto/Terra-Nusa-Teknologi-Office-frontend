<mat-dialog-content>
  <h2 class="title">Select PPh</h2>
  <p>Select corresponding tax code.</p>

  <div class="form-field">
    <input
      class="input"
      type="text"
      placeholder="Search PPh Code"
      [formControl]="pphSearchFormControl"
    />
  </div>

  <table class="table table-bordered table-hover w-100 mt-5">
    <thead>
      <tr>
        <th style="width: 20%">Code</th>
        <th>Object Name</th>
        <th style="width: 10%">Tariff (%)</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let pph of pphList" (click)="selectPph(pph)">
        <td>{{ pph.code }}</td>
        <td>{{ pph.taxObjectName }}</td>
        <td>{{ pph.tariff | number : "1.2-2" }}%</td>
      </tr>
    </tbody>
  </table>
</mat-dialog-content>
<mat-dialog-actions>
  <button class="btn btn-outlined" (click)="onClose()">
    Select None and Close
  </button>
</mat-dialog-actions>
