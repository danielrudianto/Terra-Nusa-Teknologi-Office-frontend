<div class="pp">
  <div mat-dialog-title class="pp-head">
    <div class="pp-head__text">
      <h2 class="pp-title">{{ "pph.selectTitle" | translate }}</h2>
      <span class="pp-sub">{{ "pph.selectSub" | translate }}</span>
    </div>
    <button type="button" class="pp-x" (click)="onClose()" aria-label="Tutup">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>

  <mat-dialog-content class="pp-content">
    <div class="pp-toolbar">
      <mat-form-field appearance="outline" class="pp-search">
        <svg
          matPrefix
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          class="pp-search__icon"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <mat-label>{{ "pph.searchCode" | translate }}</mat-label>
        <input
          matInput
          type="text"
          placeholder="Kode / objek pajak"
          [formControl]="pphSearchFormControl"
        />
      </mat-form-field>

      <div class="pp-skb">
        <mat-slide-toggle [formControl]="SKBFormControl" color="primary">{{
          "pph.skb" | translate
        }}</mat-slide-toggle>
        <span class="pp-skb__hint">{{ "pph.rateZero" | translate }}</span>
      </div>
    </div>

    <div class="pp-list">
      <button
        type="button"
        class="pp-row"
        *ngFor="let pph of pphList"
        (click)="selectPph(pph)"
      >
        <span class="pp-code">{{ pph.code }}</span>
        <span class="pp-obj">{{ pph.taxObjectName }}</span>
        <span class="pp-tariff" [class.pp-tariff--zero]="SKBFormControl.value">
          {{ SKBFormControl.value ? 0 : (pph.tariff | number: "1.0-2") }}%
        </span>
      </button>

      <div class="pp-empty" *ngIf="pphList.length === 0">
        {{ "pph.notFound" | translate }}
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="pp-actions">
    <button mat-button class="pp-none" (click)="onClose()">
      {{ "pph.noPphClose" | translate }}
    </button>
  </mat-dialog-actions>
</div>
