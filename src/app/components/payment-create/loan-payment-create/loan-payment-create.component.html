<div class="lpc">
  <div class="lpc-head" mat-dialog-title>
    <span class="lpc-head__icon"><mat-icon>payments</mat-icon></span>
    <div class="lpc-head__text">
      <h2 class="lpc-title">{{ "loanPayment.title" | translate }}</h2>
      <span class="lpc-sub">{{ "loanPayment.subtitle" | translate }}</span>
    </div>
  </div>

  <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="lpc-content">
      <!-- sisa tagihan ditonjolkan: ini angka acuan saat mengisi nominal -->
      <div class="lpc-outstanding">
        <span class="lpc-outstanding__label">
          {{ "loanPayment.maxAmount" | translate }}
        </span>
        <span class="lpc-outstanding__value">
          Rp {{ totalAmount | number: "1.0-0" }}
        </span>
      </div>

      <div class="lpc-grid">
        <mat-form-field appearance="outline">
          <mat-label>{{ "loanPayment.date" | translate }}</mat-label>
          <input
            matInput
            formControlName="date"
            [matDatepicker]="paymentDatePicker"
            [placeholder]="'loanPayment.datePlaceholder' | translate"
          />
          <mat-datepicker-toggle
            matIconSuffix
            [for]="paymentDatePicker"
          ></mat-datepicker-toggle>
          <mat-datepicker #paymentDatePicker></mat-datepicker>
        </mat-form-field>

        <app-bank-account-selector
          formControlName="bankAccountID"
          [label]="'loanPayment.bankAccount' | translate"
        />

        <mat-form-field appearance="outline" class="lpc-span2">
          <mat-label>{{ "loanPayment.amount" | translate }}</mat-label>
          <input
            matInput
            formControlName="amount"
            type="text"
            [placeholder]="'loanPayment.amountPlaceholder' | translate"
            prefix="Rp. "
            thousandSeparator="."
            mask="separator.0"
          />
          <button
            matSuffix
            type="button"
            class="lpc-full"
            (click)="fullAmount()"
          >
            {{ "loanPayment.payFull" | translate }}
          </button>
        </mat-form-field>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions class="lpc-foot">
      <button
        type="button"
        class="lpc-cancel"
        (click)="onClose()"
        [disabled]="isSubmitting"
      >
        {{ "loanPayment.cancel" | translate }}
      </button>
      <span class="lpc-spacer"></span>
      <button
        type="submit"
        class="lpc-submit"
        [disabled]="formGroup.invalid || isSubmitting"
      >
        {{
          isSubmitting
            ? ("loanPayment.submitting" | translate)
            : ("loanPayment.submit" | translate)
        }}
      </button>
    </mat-dialog-actions>
  </form>
</div>
