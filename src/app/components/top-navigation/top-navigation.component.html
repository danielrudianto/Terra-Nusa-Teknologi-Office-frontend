<mat-toolbar class="px-2">
  <button matIconButton (click)="onMenuClicked()" class="h-100">
    <mat-icon>menu</mat-icon>
  </button>
  <app-top-navigation-bookmark [label]="label" />

  <!--
    Akun PEMERIKSA — dikatakan, bukan disiratkan.

    Peta izinnya sudah menutup seluruh aksi tulis, sehingga tombolnya tidak
    muncul di mana-mana. Tanpa penanda ini, layar tanpa tombol terbaca
    seperti aplikasi yang rusak atau akun yang salah setel — dan yang
    memakainya, konsultan dari luar, tidak punya siapa-siapa di sebelahnya
    untuk bertanya.

    Ditaruh di bilah atas, bukan di satu halaman: sifatnya melekat pada
    akunnya, bukan pada layar tertentu.
  -->
  @if (izin.readOnly()) {
    <span class="tn-baca" [matTooltip]="'izin.hanyaBacaKet' | translate">
      <mat-icon>visibility</mat-icon>
      <span class="tn-baca__teks">{{ "izin.hanyaBaca" | translate }}</span>
    </span>
  }

  <div class="spacer"></div>

  <!-- Pencarian global: tombol yang terlihat untuk Ctrl+K. -->
  <button type="button" class="tn-cari" (click)="cari.emit()">
    <mat-icon>search</mat-icon>
    <span class="tn-cari__teks">{{ "cariGlobal.tombol" | translate }}</span>
    <span class="tn-cari__kbd"><kbd>{{ tombolPintas }}</kbd><kbd>K</kbd></span>
  </button>

  <!--
    Lonceng: yang menunggu Anda, dirinci per jenis. Angkanya jumlah seluruh
    lencana menu samping — satu sumber, jadi keduanya selalu sepakat.
  -->
  <button
    type="button"
    class="tn-icon-btn tn-lonceng"
    [matMenuTriggerFor]="menuLonceng"
    [attr.aria-label]="'notifikasi.judul' | translate"
    [matTooltip]="'notifikasi.judul' | translate"
  >
    <mat-icon>{{ totalNotifikasi() ? "notifications_active" : "notifications" }}</mat-icon>
    @if (totalNotifikasi()) {
      <span class="tn-lonceng__angka">{{ totalNotifikasi() > 99 ? "99+" : totalNotifikasi() }}</span>
    }
  </button>
  <mat-menu #menuLonceng="matMenu" class="tn-lonceng-menu" xPosition="before">
    <div class="tn-lonceng-menu__kepala" (click)="$event.stopPropagation()">
      {{ "notifikasi.judul" | translate }}
    </div>
    @for (x of notifikasi(); track x.rute) {
      <button mat-menu-item class="tn-lonceng-menu__baris" (click)="bukaNotifikasi(x.rute)">
        <mat-icon>{{ x.ikon }}</mat-icon>
        <span>{{ x.ket | translate: { n: x.n } }}</span>
      </button>
    } @empty {
      <div class="tn-lonceng-menu__kosong" (click)="$event.stopPropagation()">
        <mat-icon>task_alt</mat-icon>
        <span>{{ "notifikasi.kosong" | translate }}</span>
      </div>
    }
  </mat-menu>

  <!-- dark mode toggle -->
  <button
    type="button"
    class="tn-icon-btn"
    (click)="toggleTheme()"
    [attr.aria-label]="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
    [matTooltip]="
      isDark ? ('nav.lightMode' | translate) : ('nav.darkMode' | translate)
    "
  >
    <mat-icon>{{ isDark ? "light_mode" : "dark_mode" }}</mat-icon>
  </button>

  <!-- language switcher -->
  <app-language-switcher class="tn-lang"></app-language-switcher>

  <!-- account -->
  <button
    type="button"
    class="tn-account"
    [matMenuTriggerFor]="accountMenu"
    [attr.aria-label]="'common.account' | translate"
  >
    @if (userId) {
      <app-avatar [userId]="userId" [name]="displayName" [size]="34" />
    } @else {
      <span class="tn-account__avatar">{{ initials }}</span>
    }
    <span class="tn-account__meta">
      <span class="tn-account__name">{{ displayName }}</span>
      <span class="tn-account__role" *ngIf="email">{{ email }}</span>
    </span>
    <mat-icon class="tn-account__caret">expand_more</mat-icon>
  </button>

  <!--
    Panel disandarkan ke ujung KANAN pemicunya.
  
    Tanpa `xPosition="before"`, panel dibentangkan ke kanan dari titik klik —
    sementara tombolnya sendiri sudah menempel di tepi kanan layar, sehingga
    panelnya terpotong. Menyandarkannya ke kiri membuat tepi kanan panel
    sejajar dengan tepi kanan tombol, seperti menu akun pada umumnya.
  -->
  <mat-menu
    #accountMenu="matMenu"
    class="tn-account-menu"
    xPosition="before"
    yPosition="below"
  >
    <div class="tn-account-menu__head" mat-menu-item disabled>
      @if (userId) {
        <app-avatar [userId]="userId" [name]="displayName" [size]="48" />
      } @else {
        <span class="tn-account__avatar tn-account__avatar--lg">{{
          initials
        }}</span>
      }
      <span class="tn-account-menu__text">
        <span class="tn-account-menu__name">{{ displayName }}</span>
        <span class="tn-account-menu__email" *ngIf="email">{{ email }}</span>
      </span>
    </div>
    <mat-divider></mat-divider>
    <!--
      Bentuknya mengikuti butir sidenav, termasuk berkas ikonnya.

      Ikon dirender sebagai mask, bukan <mat-icon>, dengan alasan yang sama
      seperti di sidenav: warnanya mengikuti `currentColor` sehingga ikut
      berubah saat disorot, alih-alih dikunci oleh set ikon Material yang
      bentuk maupun tebalnya berbeda dari ikon aplikasi.
    -->
    <div class="tn-menu-list">
      <button
        type="button"
        class="tn-menu-item"
        (click)="onSettings()"
      >
        <span
          class="tn-menu-ico"
          [ngStyle]="{ '--tn-ico': 'url(assets/vector/setting.svg)' }"
        ></span>
        <span>{{ "nav.settings" | translate }}</span>
      </button>

      <button
        type="button"
        class="tn-menu-item"
        *appCan="'audit_log:read'"
        (click)="onActivity()"
      >
        <span
          class="tn-menu-ico"
          [ngStyle]="{ '--tn-ico': 'url(assets/vector/activity.svg)' }"
        ></span>
        <span>{{ "nav.activity" | translate }}</span>
      </button>

      <button
        type="button"
        class="tn-menu-item tn-menu-item--keluar"
        (click)="onLogout()"
      >
        <span
          class="tn-menu-ico"
          [ngStyle]="{ '--tn-ico': 'url(assets/vector/logout.svg)' }"
        ></span>
        <span>{{ "nav.logout" | translate }}</span>
      </button>
    </div>
  </mat-menu>
</mat-toolbar>
