<div class="dc" [class.dc--danger]="isDestructive">
  <!-- illustration -->
  <div class="dc-art">
    <span class="dc-art__ring"></span>

    <!-- destructive: cute trash bin -->
    <svg
      *ngIf="isDestructive"
      class="dc-art__svg"
      viewBox="0 0 120 120"
      fill="none"
      aria-hidden="true"
    >
      <!-- sparkles -->
      <path
        d="M96 34l1.6 4.4 4.4 1.6-4.4 1.6L96 46l-1.6-4.4L90 40l4.4-1.6z"
        fill="#f0a24b"
        opacity="0.9"
      />
      <circle cx="26" cy="52" r="3" fill="#f6c48a" />
      <circle cx="99" cy="70" r="2.4" fill="#f6c48a" />

      <!-- lid (tilted, popping off) -->
      <g transform="rotate(-8 60 34)">
        <rect x="34" y="30" width="52" height="10" rx="5" fill="#e5484d" />
        <rect x="51" y="22" width="18" height="9" rx="4.5" fill="#e5484d" />
      </g>

      <!-- body -->
      <path
        d="M41 44 h38 l-3.4 44a7 7 0 0 1-7 6.5H51.4a7 7 0 0 1-7-6.5z"
        fill="#fde3e4"
        stroke="#e5484d"
        stroke-width="3.2"
      />

      <!-- cute face -->
      <circle cx="54" cy="66" r="3" fill="#e5484d" />
      <circle cx="66" cy="66" r="3" fill="#e5484d" />
      <path
        d="M55 76q5 4 10 0"
        stroke="#e5484d"
        stroke-width="2.6"
        stroke-linecap="round"
      />
    </svg>

    <!-- non-destructive: friendly question -->
    <svg
      *ngIf="!isDestructive"
      class="dc-art__svg"
      viewBox="0 0 120 120"
      fill="none"
      aria-hidden="true"
    >
      <!-- sparkles -->
      <path
        d="M95 36l1.6 4.4 4.4 1.6-4.4 1.6L95 48l-1.6-4.4L89 42l4.4-1.6z"
        fill="var(--brand)"
        opacity="0.9"
      />
      <circle cx="27" cy="50" r="3" fill="var(--brand-soft)" />
      <circle cx="98" cy="72" r="2.4" fill="var(--brand-soft)" />

      <!-- speech bubble -->
      <path
        d="M38 34h44a10 10 0 0 1 10 10v24a10 10 0 0 1-10 10H58l-14 12v-12h-6a10 10 0 0 1-10-10V44a10 10 0 0 1 10-10z"
        fill="var(--brand-soft)"
        stroke="var(--brand)"
        stroke-width="3.2"
      />
      <!-- question mark -->
      <path
        d="M54 50a8 8 0 0 1 14 5c0 5-6 6-6 10"
        stroke="var(--brand)"
        stroke-width="3.4"
        stroke-linecap="round"
        fill="none"
      />
      <circle cx="62" cy="70" r="2.6" fill="var(--brand)" />
    </svg>
  </div>

  <h2 class="dc-title" mat-dialog-title>{{ data.title }}</h2>
  <mat-dialog-content class="dc-content">
    <p>{{ data.prompt }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="dc-actions">
    <button type="button" class="dc-btn dc-btn--ghost" (click)="onCancel()">
      {{ labelBatal }}
    </button>
    <button type="button" class="dc-btn dc-btn--confirm" (click)="onConfirm()">
      {{ labelLanjut }}
    </button>
  </mat-dialog-actions>
</div>
