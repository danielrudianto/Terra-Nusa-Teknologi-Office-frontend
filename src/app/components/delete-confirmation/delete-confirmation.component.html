<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.prompt }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button style="letter-spacing: 0" (click)="onCancel()">
    Cancel
  </button>
  <button
    mat-stroked-button
    style="letter-spacing: 0"
    color="primary"
    (click)="onConfirm()"
  >
    Confirm
  </button>
</mat-dialog-actions>
