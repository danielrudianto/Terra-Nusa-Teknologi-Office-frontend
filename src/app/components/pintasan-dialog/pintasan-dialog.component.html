<div class="pd">
  <div class="pd-head" mat-dialog-title appDialogGeser>
    <span class="pd-badge">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="6" width="19" height="12" rx="2" />
        <path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7.5 14h9" />
      </svg>
    </span>
    <div class="pd-head__text">
      <h2 class="pd-title">{{ "pintasan.judul" | translate }}</h2>
      <span class="pd-sub">{{ "pintasan.sub" | translate }}</span>
    </div>
  </div>

  <mat-dialog-content class="pd-content">
    @for (p of daftar; track p.label) {
      <div class="pd-baris">
        <span class="pd-label">{{ p.label | translate }}</span>
        <span class="pd-tombol">
          @for (t of p.tombol; track t) {
            <kbd>{{ t }}</kbd>
          }
        </span>
      </div>
    }
  </mat-dialog-content>

  <mat-dialog-actions class="pd-actions">
    <button type="button" class="pd-cancel" (click)="tutup()">
      {{ "pintasan.tutupTombol" | translate }}
    </button>
  </mat-dialog-actions>
</div>
