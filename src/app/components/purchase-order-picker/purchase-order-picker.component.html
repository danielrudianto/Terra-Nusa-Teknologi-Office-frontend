<div class="pop">
  <div class="pop-head" mat-dialog-title appDialogGeser>
    <span class="pop-badge"><mat-icon>receipt_long</mat-icon></span>
    <div class="pop-head__text">
      <h2 class="pop-title">{{ "poPicker.judul" | translate }}</h2>
      <span class="pop-sub">{{ "poPicker.sub" | translate }}</span>
    </div>
  </div>

  <mat-dialog-content class="pop-content">
    <mat-form-field
      appearance="outline"
      class="pop-search"
      subscriptSizing="dynamic"
    >
      <mat-icon matPrefix>search</mat-icon>
      <input
        autocomplete="off"
            type="search"
        matInput
        [formControl]="searchBar"
        [placeholder]="'poPicker.cari' | translate"
      />
    </mat-form-field>

    @if (isLoading) {
      <div class="pop-state"><mat-spinner diameter="30"></mat-spinner></div>
    } @else if (!daftar.length) {
      <div class="pop-state pop-state--kosong">
        {{ "poPicker.kosong" | translate }}
      </div>
    } @else {
      <div class="pop-list">
        @for (po of daftar; track po.id) {
          <button type="button" class="pop-item" (click)="pilih(po)">
            <span class="pop-item__body">
              <span class="pop-item__nomor">
                {{ po.name }}
                <!--
                  Status ditandai, dokumen draf tetap dapat dipilih.

                  Tagihan kerap datang sebelum persetujuan internal selesai;
                  menyembunyikannya memaksa pencatat mengetik ulang manual.
                -->
                @if (!sudahDisetujui(po)) {
                  <span class="pop-item__draf">{{
                    "poPicker.draf" | translate
                  }}</span>
                }
              </span>
              <span class="pop-item__meta">
                {{ pemasok(po) }} · {{ po.projectName || "—" }}
              </span>
            </span>
            <span class="pop-item__nilai">
              Rp {{ angka(po.dpp) | number: "1.0-0" }}
            </span>
          </button>
        }
      </div>
    }
  </mat-dialog-content>

  <mat-dialog-actions class="pop-foot">
    <span class="pop-spacer"></span>
    <button type="button" class="pop-close" (click)="tutup()">
      {{ "common.cancel" | translate }}
    </button>
  </mat-dialog-actions>
</div>
